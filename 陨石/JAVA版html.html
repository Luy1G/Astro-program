<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>陆地陨石撞击模拟器 v3.0 ｜ JS独立版</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
  body { font-family: "Microsoft YaHei", Arial, sans-serif; background:#0a0e14; color:#e0e6ed; }
  h1 { font-size: 18px; margin:0; padding:12px 20px; background:linear-gradient(90deg,#111820,#1a2636); border-bottom:1px solid #1f2933; color:#8b949e; font-weight:500; letter-spacing:1px; position:relative; z-index:20; }
  h1 span { color:#58a6ff; font-weight:700; }
  h1 .ver { color:#d2a8ff; font-size:12px; margin-left:8px; }

  /* 全屏布局：canvas作为背景铺满视口，面板悬浮在上方 */
  .fullscreen-canvas { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:0; }
  .fullscreen-canvas canvas { display:block; width:100%; height:100%; }

  /* 左侧参数面板：固定悬浮在左上角 */
  .panel-left { position:absolute; top:60px; left:10px; width:260px; z-index:10; background:rgba(20,26,34,0.88); backdrop-filter:blur(8px); padding:14px; overflow-y:auto; max-height:calc(100vh - 70px); border-radius:8px; border:1px solid rgba(88,166,255,0.15); }

  /* 右侧信息面板：固定悬浮在右上角 */
  .panel-right { position:absolute; top:60px; right:10px; width:340px; z-index:10; background:rgba(20,26,34,0.88); backdrop-filter:blur(8px); padding:14px; overflow-y:auto; max-height:calc(100vh - 70px); border-radius:8px; border:1px solid rgba(88,166,255,0.15); }

  /* ===== v2.1 右侧面板增强样式 ===== */
  /* Hero 卡：TNT 当量 */
  .hero-card { background:linear-gradient(135deg,#1a1040,#0d2a4a); border:1px solid rgba(136,166,255,0.3); border-radius:10px; padding:14px 16px; margin-bottom:12px; text-align:center; }
  .hero-card .hero-label { font-size:10px; color:#8b949e; text-transform:uppercase; letter-spacing:2px; margin-bottom:4px; }
  .hero-card .hero-value { font-size:28px; font-weight:800; background:linear-gradient(90deg,#58a6ff,#d2a8ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; line-height:1.2; }
  .hero-card .hero-sub { font-size:11px; color:#8b949e; margin-top:2px; }
  /* 对数刻度尺 */
  .tnt-scale { margin-top:10px; }
  .tnt-scale .scale-track { height:8px; border-radius:4px; background:linear-gradient(90deg,#58a6ff,#3fb950,#d29922,#f78166,#f85149,#da3633); position:relative; }
  .tnt-scale .scale-marker { position:absolute; top:-4px; width:4px; height:16px; background:#fff; border-radius:2px; box-shadow:0 0 6px rgba(255,255,255,0.8); transition:left 0.3s; }
  .tnt-scale .scale-labels { display:flex; justify-content:space-between; margin-top:4px; font-size:8px; color:#6e7681; }

  /* 2×2 指标网格 */
  .metric-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .metric-card { background:#161b22; border:1px solid #21262d; border-radius:8px; padding:10px 12px; }
  .metric-card .mc-label { font-size:10px; color:#6e7681; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
  .metric-card .mc-value { font-size:16px; font-weight:700; color:#e8eaed; font-family:Consolas,monospace; }
  .metric-card .mc-unit { font-size:10px; color:#8b949e; margin-left:2px; }
  .metric-card .mc-sub { font-size:10px; color:#6e7681; margin-top:2px; }

  /* 大气烧蚀卡 */
  .ablation-card { background:#161b22; border-radius:8px; padding:12px; margin-bottom:12px; border-left:4px solid #8957e5; }
  .ablation-card .ac-title { font-size:11px; color:#d2a8ff; margin-bottom:8px; font-weight:600; }
  .progress-row { margin-bottom:8px; }
  .progress-row:last-child { margin-bottom:0; }
  .progress-row .pr-header { display:flex; justify-content:space-between; font-size:11px; margin-bottom:4px; }
  .progress-row .pr-label { color:#8b949e; }
  .progress-row .pr-value { color:#58a6ff; font-weight:600; font-family:Consolas,monospace; }
  .progress-row .pr-bar { height:8px; background:#21262d; border-radius:4px; overflow:hidden; }
  .progress-row .pr-fill { height:100%; border-radius:4px; transition:width 0.4s ease; }
  .progress-row .pr-fill.purple { background:linear-gradient(90deg,#6f42c1,#8957e5); }
  .progress-row .pr-fill.orange { background:linear-gradient(90deg,#d29922,#f78166); }
  .progress-row .pr-fill.green { background:linear-gradient(90deg,#238636,#3fb950); }
  .progress-row .pr-fill.red { background:linear-gradient(90deg,#da3633,#f85149); }

  /* 终态模式卡 */
  .mode-card { background:#161b22; border-radius:8px; padding:12px; margin-bottom:12px; border-left:4px solid #3fb950; }
  .mode-card.air { border-left-color:#f85149; }
  .mode-card.burn { border-left-color:#d29922; }
  .mode-card .mc-mode-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .mode-card .mc-mode-icon { font-size:20px; }
  .mode-card .mc-mode-name { font-size:14px; font-weight:700; }
  .mode-card .mc-detail { font-size:11px; color:#8b949e; line-height:1.6; }

  /* 灾害范围可视化 */
  .disaster-card { background:#161b22; border-radius:8px; padding:12px; margin-bottom:12px; }
  .disaster-card .dc-title { font-size:11px; color:#8b949e; margin-bottom:10px; font-weight:600; }
  .disaster-bar { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .disaster-bar .db-label { width:60px; font-size:10px; color:#8b949e; text-align:right; flex-shrink:0; }
  .disaster-bar .db-track { flex:1; height:18px; background:#21262d; border-radius:3px; overflow:hidden; position:relative; }
  .disaster-bar .db-fill { height:100%; border-radius:3px; display:flex; align-items:center; padding-left:6px; }
  .disaster-bar .db-text { font-size:9px; color:#fff; font-weight:600; white-space:nowrap; line-height:18px; }
  .disaster-bar .db-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  /* 能量换算卡 */
  .energy-compare { background:#161b22; border-radius:8px; padding:12px; margin-bottom:12px; border:1px solid #21262d; }
  .energy-compare .ec-title { font-size:11px; color:#d2a8ff; margin-bottom:8px; font-weight:600; }
  .energy-compare .ec-item { display:flex; justify-content:space-between; align-items:center; padding:4px 0; font-size:11px; }
  .energy-compare .ec-item .ec-name { color:#8b949e; }
  .energy-compare .ec-item .ec-val { color:#d2a8ff; font-weight:600; font-family:Consolas,monospace; }
  .energy-compare .ec-item .ec-bar { display:inline-block; width:50px; height:4px; background:#21262d; border-radius:2px; margin:0 6px; overflow:hidden; vertical-align:middle; }
  .energy-compare .ec-item .ec-bar-fill { height:100%; background:#8957e5; border-radius:2px; }

  /* 灾害等级卡 */
  .level-card { border-radius:8px; padding:12px; margin-bottom:12px; text-align:center; }
  .level-card.critical { background:linear-gradient(135deg,#3d1010,#1a0808); border:2px solid #da3633; }
  .level-card.severe { background:linear-gradient(135deg,#3d2010,#1a1008); border:2px solid #f85149; }
  .level-card.moderate { background:linear-gradient(135deg,#3d2a10,#1a2008); border:2px solid #f78166; }
  .level-card.minor { background:linear-gradient(135deg,#2d2a10,#1a2008); border:2px solid #d29922; }
  .level-card.safe { background:linear-gradient(135deg,#102d1a,#081a10); border:2px solid #3fb950; }
  .level-card .lc-level { font-size:18px; font-weight:800; margin-bottom:4px; }
  .level-card .lc-desc { font-size:11px; color:#8b949e; }
  .level-card.critical .lc-level { color:#da3633; }
  .level-card.severe .lc-level { color:#f85149; }
  .level-card.moderate .lc-level { color:#f78166; }
  .level-card.minor .lc-level { color:#d29922; }
  .level-card.safe .lc-level { color:#3fb950; }

  /* 底部动画控制栏：悬浮在底部居中 */
  .anim-bar { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); z-index:10; padding:10px 16px; background:rgba(13,17,23,0.9); backdrop-filter:blur(8px); display:flex; gap:10px; align-items:center; font-size:12px; border:1px solid rgba(88,166,255,0.2); border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,0.5); }

  .section-title { font-size:11px; color:#58a6ff; text-transform:uppercase; letter-spacing:1.5px; margin:0 0 10px 0; padding-bottom:6px; border-bottom:1px solid #21262d; }
  .control { margin-bottom:13px; }
  .control label { display:flex; justify-content:space-between; font-size:12px; color:#8b949e; margin-bottom:5px; }
  .control label .val { color:#58a6ff; font-weight:bold; font-family:Consolas,monospace; }
  .control input[type=range] { width:100%; height:4px; background:#21262d; border-radius:2px; appearance:none; outline:none; }
  .control input[type=range]::-webkit-slider-thumb { appearance:none; width:14px; height:14px; border-radius:50%; background:#58a6ff; cursor:pointer; box-shadow:0 0 6px rgba(88,166,255,0.5); }
  select { width:100%; padding:6px 8px; background:#21262d; color:#e8eaed; border:1px solid #30363d; border-radius:4px; font-size:12px; outline:none; }
  select:focus { border-color:#58a6ff; }
  .btn { padding:9px 14px; background:linear-gradient(180deg,#238636,#1f7a2f); color:#fff; border:1px solid #2ea043; border-radius:6px; font-size:13px; cursor:pointer; width:100%; font-weight:600; transition:all .15s; }
  .btn:hover { background:linear-gradient(180deg,#2ea043,#238636); box-shadow:0 0 12px rgba(46,160,67,0.3); }
  .btn.ghost { background:transparent; color:#8b949e; border:1px solid #30363d; }
  .btn.ghost:hover { background:#21262d; color:#e8eaed; }
  .result-section { margin-bottom:16px; }
  .result-section h3 { font-size:11px; color:#8b949e; margin:0 0 8px 0; text-transform:uppercase; letter-spacing:1px; }
  .kv { display:flex; justify-content:space-between; font-size:11px; padding:3px 0; }
  .kv .k { color:#6e7681; }
  .kv .v { color:#e8eaed; font-weight:600; font-family:Consolas,monospace; }
  .kv .v.highlight { color:#58a6ff; }
  .level-box { padding:8px 12px; border-radius:6px; background:linear-gradient(135deg,#2d1810,#1a0f08); border-left:4px solid #f85149; margin:8px 0; font-size:12px; color:#ffa198; }
  .level-box.info { background:linear-gradient(135deg,#0d1f2d,#0a1520); border-left-color:#58a6ff; color:#79c0ff; }
  .level-box b { color:#f85149; }
  .level-box.info b { color:#58a6ff; }
  .fun-ref { background:#161b22; padding:8px 10px; border-radius:4px; margin-top:6px; font-size:11px; color:#8b949e; line-height:1.6; }
  .fun-ref b { color:#d2a8ff; }
  canvas { display:block; }
  .anim-bar input[type=range] { flex:1; max-width:300px; height:4px; background:#21262d; border-radius:2px; appearance:none; }
  .anim-bar input[type=range]::-webkit-slider-thumb { appearance:none; width:12px; height:12px; border-radius:50%; background:#58a6ff; cursor:pointer; }
  .anim-bar span { color:#8b949e; }
  .anim-bar .status { color:#3fb950; font-size:11px; }
  .time-bar { flex:1; display:flex; align-items:center; gap:8px; }
  .time-bar input[type=range] { flex:1; max-width:none; height:6px; background:#21262d; border-radius:3px; appearance:none; cursor:pointer; }
  .time-bar input[type=range]::-webkit-slider-thumb { appearance:none; width:14px; height:14px; border-radius:50%; background:#58a6ff; cursor:grab; box-shadow:0 0 8px rgba(88,166,255,0.5); }
  .time-bar input[type=range]:active::-webkit-slider-thumb { cursor:grabbing; }
  .time-bar .time-label { font-family:Consolas,monospace; color:#8b949e; font-size:11px; min-width:90px; text-align:right; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:600; }
  .tag.air { background:#3d1a1a; color:#f85149; }
  .tag.ground { background:#1a3d2a; color:#3fb950; }
  .tag.burn { background:#2d2a1a; color:#d29922; }
  .tnt-bar { margin-top:8px; padding:6px 10px; background:#161b22; border-radius:4px; font-size:11px; color:#8b949e; }
  .tnt-bar .bar { height:6px; background:#21262d; border-radius:3px; margin-top:4px; overflow:hidden; }
  .tnt-bar .bar-fill { height:100%; border-radius:3px; transition:width 0.3s; }

  /* ============== AI 面板样式 ============== */
  .ai-panel { background:linear-gradient(135deg,#0d1f2d,#1a0f28); border:1px solid #3a2a5c; border-radius:8px; padding:14px; margin-bottom:12px; }
  .ai-panel .ai-title { font-size:12px; color:#d2a8ff; margin:0 0 10px 0; display:flex; align-items:center; gap:6px; }
  .ai-panel .ai-title::before { content:'🤖'; }
  .ai-btn { padding:8px 14px; background:linear-gradient(135deg,#6f42c1,#563d7c); color:#fff; border:none; border-radius:6px; font-size:12px; cursor:pointer; font-weight:600; width:100%; margin-bottom:8px; transition:all .2s; }
  .ai-btn:hover { background:linear-gradient(135deg,#8957e5,#6f42c1); box-shadow:0 0 12px rgba(111,66,193,0.4); }
  .ai-btn:disabled { opacity:0.5; cursor:not-allowed; }
  .ai-output { background:#161b22; border-radius:6px; padding:10px; font-size:12px; color:#c9d1d9; line-height:1.7; max-height:200px; overflow-y:auto; display:none; white-space:pre-wrap; }
  .ai-output.show { display:block; }
  .ai-output.loading { color:#8b949e; font-style:italic; }
  .ai-output::after { content:'▋'; color:#58a6ff; animation:blink 0.8s steps(2) infinite; }
  .ai-output.done::after { content:''; }
  @keyframes blink { 50% { opacity:0; } }

  /* AI 灾害推演面板增强样式 */
  .ai-narrative-panel { background:linear-gradient(135deg,#0d1f2d,#1a0f28); border:1px solid rgba(137,87,229,0.4); border-radius:10px; padding:16px; box-shadow:0 4px 20px rgba(111,66,193,0.15); }
  .ai-narrative-panel .ai-title { font-size:14px; color:#d2a8ff; margin:0 0 12px 0; padding-bottom:8px; border-bottom:1px solid rgba(137,87,229,0.2); }
  .ai-narrative-output { background:linear-gradient(180deg,#0d1117,#161b22); border:1px solid #21262d; border-radius:8px; padding:16px; font-size:13px; color:#c9d1d9; line-height:2.0; max-height:380px; overflow-y:auto; white-space:pre-wrap; word-break:break-word; margin-bottom:12px; box-shadow:inset 0 1px 3px rgba(0,0,0,0.3); }
  .ai-narrative-output::-webkit-scrollbar { width:6px; }
  .ai-narrative-output::-webkit-scrollbar-track { background:#0d1117; border-radius:3px; }
  .ai-narrative-output::-webkit-scrollbar-thumb { background:#30363d; border-radius:3px; }
  .ai-narrative-output::-webkit-scrollbar-thumb:hover { background:#484f58; }
  .ai-narrative-output.loading { color:#8b949e; font-style:italic; }
  .ai-paragraph { opacity:0; transition:opacity 0.5s ease; margin-bottom:10px; padding-left:10px; border-left:2px solid rgba(137,87,229,0.3); }
  .ai-paragraph:last-child { margin-bottom:0; }

</style>
</head>
<body>
<h1>陆地陨石撞击模拟器 <span>v3.0</span> ｜ <span class="ver">JS独立版</span></h1>
<!-- 全屏canvas背景 -->
<div class="fullscreen-canvas">
  <canvas id="canvas"></canvas>
</div>
<!-- 左侧悬浮面板 -->
<div class="panel-left">
  <div class="section-title">输入参数</div>
  <div class="control"><label>陨石材质</label>
    <select id="material">
      <option value="冰彗星">冰彗星 (1000 千克/立方米)</option>
      <option value="岩石陨石" selected>岩石陨石 (3000 千克/立方米)</option>
      <option value="铁陨石">铁陨石 (7800 千克/立方米)</option>
    </select>
  </div>
  <div class="control"><label>陨石直径 <span class="val" id="diameterVal">50 米</span></label>
    <input type="range" id="diameter" min="5" max="5000" value="50" step="1"></div>
  <div class="control"><label>撞击速度 <span class="val" id="velocityVal">20 千米每秒</span></label>
    <input type="range" id="velocity" min="12" max="70" value="20" step="0.5"></div>
  <div class="control"><label>入射角 <span class="val" id="angleVal">45度</span></label>
    <input type="range" id="angle" min="5" max="90" value="45" step="1"></div>
  <div class="control"><label>撞击目标</label>
    <div style="padding:6px 8px;background:#161b22;color:#3fb950;border:1px solid #21262d;border-radius:4px;font-size:12px;font-weight:600;">陆地</div></div>
  <div class="control"><label>观测距离 <span class="val" id="obsVal">50 千米</span></label>
    <input type="range" id="observer_distance" min="1" max="5000" value="50" step="1"></div>
  <button class="btn" id="runBtn">▶ 运行模拟</button>
  <div class="tnt-bar" id="tntBar" style="display:none;">
    <div>爆炸量级 <span id="tntLabel">—</span></div>
    <div class="bar"><div class="bar-fill" id="tntFill" style="width:0%;background:#3fb950;"></div></div>
  </div>

</div>

<!-- 右侧悬浮面板 -->
<div class="panel-right">
  <div id="resultsArea" style="display:none;">
    <!-- Hero 卡：TNT 当量 -->
    <div class="hero-card">
      <div class="hero-label">TNT 当量</div>
      <div class="hero-value" id="tntHero">—</div>
      <div class="hero-sub" id="tntHeroSub">—</div>
      <div class="tnt-scale">
        <div class="scale-track">
          <div class="scale-marker" id="tntScaleMarker" style="left:0%;"></div>
        </div>
        <div class="scale-labels">
          <span>1吨</span><span>100吨</span><span>1千吨</span><span>1万吨</span><span>10万吨</span><span>1百万吨</span><span>1亿吨</span>
        </div>
      </div>
    </div>

    <!-- 2×2 指标网格 -->
    <div class="metric-grid">
      <div class="metric-card">
        <div class="mc-label">初始质量</div>
        <div class="mc-value" id="metricMass">—</div>
        <div class="mc-sub" id="metricMassSub">—</div>
      </div>
      <div class="metric-card">
        <div class="mc-label">撞击速度</div>
        <div class="mc-value" id="metricVel">—</div>
        <div class="mc-sub" id="metricVelSub">—</div>
      </div>
      <div class="metric-card">
        <div class="mc-label">初始动能</div>
        <div class="mc-value" id="metricKE">—</div>
        <div class="mc-sub" id="metricKESub">—</div>
      </div>
      <div class="metric-card">
        <div class="mc-label">陨石直径</div>
        <div class="mc-value" id="metricDia">—</div>
        <div class="mc-sub" id="metricDiaSub">—</div>
      </div>
    </div>

    <!-- 大气烧蚀卡 -->
    <div class="ablation-card">
      <div class="ac-title">大气烧蚀损耗</div>
      <div class="progress-row">
        <div class="pr-header">
          <span class="pr-label">质量损失比</span>
          <span class="pr-value" id="ablationRatio">—</span>
        </div>
        <div class="pr-bar"><div class="pr-fill purple" id="ablationBar" style="width:0%;"></div></div>
      </div>
      <div class="progress-row">
        <div class="pr-header">
          <span class="pr-label">能量沉积比</span>
          <span class="pr-value" id="eAtmRatio">—</span>
        </div>
        <div class="pr-bar"><div class="pr-fill orange" id="eAtmBar" style="width:0%;"></div></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:10px;color:#6e7681;">
        <span>烧蚀质量: <b id="ablationMass" style="color:#d2a8ff;">—</b></span>
        <span>峰值高度: <b id="peakH" style="color:#d2a8ff;">—</b></span>
      </div>
    </div>

    <!-- 终态模式卡 -->
    <div class="mode-card" id="modeCard">
      <div class="mc-mode-row">
        <span class="mc-mode-icon" id="modeIcon">🌍</span>
        <span class="mc-mode-name" id="modeName">—</span>
      </div>
      <div class="mc-detail" id="modeDetail">—</div>
    </div>

    <!-- 能量换算卡 -->
    <div class="energy-compare">
      <div class="ec-title">⚡ 能量换算</div>
      <div class="ec-item">
        <span class="ec-name">广岛原子弹</span>
        <span><span class="ec-bar"><span class="ec-bar-fill" id="hiroshimaBar" style="width:0%;"></span></span><span class="ec-val" id="hiroshimaEq">—</span></span>
      </div>
      <div class="ec-item">
        <span class="ec-name">三峡日发电</span>
        <span><span class="ec-bar"><span class="ec-bar-fill" id="threeGorgesBar" style="width:0%;"></span></span><span class="ec-val" id="threeGorgesEq">—</span></span>
      </div>
      <div class="ec-item">
        <span class="ec-name">里氏震级等效</span>
        <span class="ec-val" id="richterEq">—</span>
      </div>
      <div class="ec-item">
        <span class="ec-name">实际释放能量</span>

<!-- ============================================================
     陆地陨石撞击模拟器 v3.0 — 物理仿真 + 模板匹配引擎（内联 JS，独立运行无需后端）
     ============================================================ -->
<script>
const MATERIALS = {
    "冰彗星":   {"density": 1000.0, "strength": 1.0e6,  "desc": "质地松散，极易在大气中解体"},
    "岩石陨石": {"density": 3000.0, "strength": 5.0e6,  "desc": "普通球粒陨石，常见近地小行星"},
    "铁陨石":   {"density": 7800.0, "strength": 2.0e8,  "desc": "金属小行星碎片，穿透性极强"},
};

const JOULES_PER_TNT_TON = 4.184e9;
const JOULES_PER_TNT_KG = 4.184e6;
const TNT_TON_PER_JOULE = 1.0 / JOULES_PER_TNT_TON;
const TNT_KG_PER_JOULE = 1.0 / JOULES_PER_TNT_KG;

const FUN_REFERENCES = {
    "标准军用手榴弹": 0.05,
    "普通航空炸弹":   500.0,
    "广岛原子弹":     1.5e7,
};

const RHO_AIR_SEA = 1.225;
const SCALE_HEIGHT = 8500.0;
const ATM_COLUMN_MASS = 1.0e4;
const ATMOSPHERE_TOP = 200000.0;

const DRAG_COEFFICIENT = 1.0;
const HEAT_TRANSFER_COEFF = 0.1;
const ABLATION_HEAT = 5.0e6;
const PANCAKE_FACTOR = 5.0;

const TARGET_DENSITY = {
    "陆地": 2700.0,
};

const OVERPRESSURE_SCALED_DIST = {
    "core":     2.0,
    "secondary": 3.0,
    "outer":    8.0,
};

const FIREBALL_COEFF = 0.0023;
const THIRD_DEGREE_BURN_FLUENCE = 4.184e5;


function radius_from_diameter(diameter_m) {
    return diameter_m / 2.0;
}

function cross_section_area(diameter_m) {
    const r = radius_from_diameter(diameter_m);
    return Math.PI * r * r;
}

function compute_mass(diameter_m, material_key) {
    const r = radius_from_diameter(diameter_m);
    const rho = MATERIALS[material_key]["density"];
    return (4.0 / 3.0) * Math.PI * Math.pow(r, 3) * rho;
}

function compute_radius_from_mass(mass_kg, density) {
    if (mass_kg <= 0 || density <= 0) {
        return 0.0;
    }
    return Math.pow((3.0 * mass_kg) / (4.0 * Math.PI * density), 1.0 / 3.0);
}

function compute_kinetic_energy(mass_kg, velocity_kms) {
    const v_ms = velocity_kms * 1000.0;
    return 0.5 * mass_kg * v_ms * v_ms;
}

function joule_to_tnt_ton(energy_j) {
    return energy_j * TNT_TON_PER_JOULE;
}

function joule_to_tnt_kg(energy_j) {
    return energy_j * TNT_KG_PER_JOULE;
}

function compute_fun_references(tnt_kg) {
    const result = {};
    for (const [name, kg] of Object.entries(FUN_REFERENCES)) {
        result[name] = tnt_kg / kg;
    }
    return result;
}

function air_density(altitude_m) {
    if (altitude_m < 0) {
        altitude_m = 0.0;
    }
    return RHO_AIR_SEA * Math.exp(-altitude_m / SCALE_HEIGHT);
}

function air_density_with_gradient(altitude_m) {
    if (altitude_m < 0) {
        altitude_m = 0.0;
    }
    if (altitude_m < 25000) {
        return RHO_AIR_SEA * Math.exp(-altitude_m / 8500.0);
    }
    const rho_25 = RHO_AIR_SEA * Math.exp(-25000 / 8500.0);
    return rho_25 * Math.exp(-(altitude_m - 25000) / 6000.0);
}



// ---- Constants Namespace (for part2/part3) ----
const C = {
  MATERIALS: MATERIALS,
  FUN_REFERENCES: FUN_REFERENCES,
  JOULES_PER_TNT_TON: JOULES_PER_TNT_TON,
  JOULES_PER_TNT_KG: JOULES_PER_TNT_KG,
  TNT_TON_PER_JOULE: TNT_TON_PER_JOULE,
  TNT_KG_PER_JOULE: TNT_KG_PER_JOULE,
  RHO_AIR_SEA: RHO_AIR_SEA,
  SCALE_HEIGHT: SCALE_HEIGHT,
  ATM_COLUMN_MASS: ATM_COLUMN_MASS,
  ATMOSPHERE_TOP: ATMOSPHERE_TOP,
  DRAG_COEFFICIENT: DRAG_COEFFICIENT,
  HEAT_TRANSFER_COEFF: HEAT_TRANSFER_COEFF,
  ABLATION_HEAT: ABLATION_HEAT,
  PANCAKE_FACTOR: PANCAKE_FACTOR,
  TARGET_DENSITY: TARGET_DENSITY,
  OVERPRESSURE_SCALED_DIST: OVERPRESSURE_SCALED_DIST,
  FIREBALL_COEFF: FIREBALL_COEFF,
  THIRD_DEGREE_BURN_FLUENCE: THIRD_DEGREE_BURN_FLUENCE,
};


const G0 = 9.81;
const R_EARTH = 6371000.0;
const ABLATION_SPEED_CUTOFF = 3000.0;

function _gravity_at_altitude(h) {
    return G0 * Math.pow(R_EARTH / (R_EARTH + h), 2);
}

function integrate_trajectory(diameter_m, material_key, velocity_kms,
                              entry_angle_deg, dt = 0.01, sample_every = 20) {
    const m0 = compute_mass(diameter_m, material_key);
    const rho_body = C.MATERIALS[material_key]["density"];
    const strength = C.MATERIALS[material_key]["strength"];

    let m = m0;
    let v = velocity_kms * 1000.0;
    let h = C.ATMOSPHERE_TOP;

    let theta = entry_angle_deg * Math.PI / 180.0;

    let v_x = v * Math.cos(theta);
    let v_y = v * Math.sin(theta);

    let t = 0.0;
    const samples = [];
    let energy_atm = 0.0;
    const energy_profile = [];
    let e_peak_dt_rate = 0.0;
    let e_peak_h = 0.0;

    let breakup_triggered = false;
    let breakup_alt = 0.0;
    let breakup_t = 0.0;
    let breakup_e = 0.0;
    let pancake_mult = 1.0;

    let step = 0;
    while (h > 0 && m > m0 * 0.001) {
        const rho_a = air_density_with_gradient(h);
        const g = _gravity_at_altitude(h);

        const r = compute_radius_from_mass(m, rho_body);
        const A = Math.PI * r * r * pancake_mult;
        const q = 0.5 * rho_a * v * v;

        const e_deposited = 0.5 * rho_a * Math.pow(v, 3) * C.DRAG_COEFFICIENT * A * dt;
        energy_atm += e_deposited;

        if (e_deposited / dt > e_peak_dt_rate) {
            e_peak_dt_rate = e_deposited / dt;
            e_peak_h = h;
        }

        if ((!breakup_triggered) && (q >= strength)) {
            breakup_triggered = true;
            breakup_alt = h;
            breakup_t = t;
            breakup_e = energy_atm;
            pancake_mult = C.PANCAKE_FACTOR;
        }

        const a_drag = (rho_a * v * v * C.DRAG_COEFFICIENT * A) / (2.0 * m);
        let dv_x, dv_y;
        if (v > 0) {
            dv_x = -a_drag * (v_x / v) * dt;
            dv_y = (-a_drag * (v_y / v) + g) * dt;
        } else {
            dv_x = 0.0;
            dv_y = g * dt;
        }
        v_x += dv_x;
        v_y += dv_y;

        v = Math.sqrt(v_x * v_x + v_y * v_y);
        v = Math.max(v, 0.0);

        let sin_theta;
        if (v > 0) {
            theta = Math.atan2(v_y, v_x);
            sin_theta = v_y / v;
        } else {
            sin_theta = 1.0;
        }

        let dm;
        if (v > ABLATION_SPEED_CUTOFF) {
            dm = -(rho_a * Math.pow(v, 3) * C.HEAT_TRANSFER_COEFF * A /
                   C.ABLATION_HEAT) * dt;
        } else {
            dm = 0.0;
        }

        const dh = -v_y * dt;

        m += dm;
        h += dh;
        t += dt;
        step += 1;

        if (v <= 0) {
            break;
        }

        if (step % sample_every === 0) {
            samples.push({
                "t": t,
                "h_km": h / 1000.0,
                "v_kms": v / 1000.0,
                "m_kg": m,
                "q_Pa": q,
                "e_atm_j": energy_atm,
            });
            energy_profile.push([h / 1000.0, energy_atm]);
        }
    }

    const terminal_v = Math.max(v, 0.0);
    const terminal_m = Math.max(m, 0.0);
    const terminal_e_kin = 0.5 * terminal_m * terminal_v * terminal_v;

    const initial_e_kin = 0.5 * m0 * Math.pow(velocity_kms * 1000.0, 2);

    if (h <= 0 && terminal_m > m0 * 0.001) {
        if (samples.length > 0) {
            const s = samples[samples.length - 1];
            const h_last = s["h_km"] * 1000.0;
            let t_ground, v_ground, m_ground;
            if (h_last > 0 && t > s["t"] && (h_last - h) > 0) {
                const frac = h_last / (h_last - h);
                t_ground = s["t"] + (t - s["t"]) * frac;
                const v_s_last = s["v_kms"] * 1000.0;
                v_ground = v_s_last + (v - v_s_last) * frac;
                const m_s_last = s["m_kg"];
                m_ground = Math.max(m_s_last + (terminal_m - m_s_last) * frac, 0.0);
            } else {
                t_ground = t;
                v_ground = terminal_v;
                m_ground = terminal_m;
            }
            samples.push({
                "t": t_ground,
                "h_km": 0.0,
                "v_kms": v_ground / 1000.0,
                "m_kg": m_ground,
                "q_Pa": 0.0,
                "e_atm_j": energy_atm,
            });
            energy_profile.push([0.0, energy_atm]);
        } else {
            samples.push({
                "t": t,
                "h_km": 0.0,
                "v_kms": terminal_v / 1000.0,
                "m_kg": terminal_m,
                "q_Pa": 0.0,
                "e_atm_j": energy_atm,
            });
            energy_profile.push([0.0, energy_atm]);
        }
    }

    const atm_ratio = initial_e_kin > 0 ? energy_atm / initial_e_kin : 0.0;
    const ground_ratio = initial_e_kin > 0 ? terminal_e_kin / initial_e_kin : 0.0;

    return {
        "samples": samples,
        "terminal": {
            "h_km": Math.max(h, 0.0) / 1000.0,
            "v_kms": terminal_v / 1000.0,
            "m_kg": terminal_m,
            "e_kinetic_j": terminal_e_kin,
            "impact_happened": h <= 0 && terminal_m > m0 * 0.001,
        },
        "breakup": {
            "triggered": breakup_triggered,
            "altitude_km": breakup_alt / 1000.0,
            "time_s": breakup_t,
            "energy_before_breakup_j": breakup_e,
        },
        "ablation_kg": m0 - terminal_m,
        "ablation_ratio": m0 > 0 ? (m0 - terminal_m) / m0 : 0.0,
        "energy_atm_j": energy_atm,
        "energy_atm_ratio": atm_ratio,
        "energy_peak_h_km": e_peak_h / 1000.0,
        "energy_profile": energy_profile,
        "initial": {
            "mass_kg": m0,
            "velocity_kms": velocity_kms,
            "kinetic_energy_j": initial_e_kin,
        },
        "energy_distribution": {
            "initial_kinetic_j": initial_e_kin,
            "atmospheric_j": energy_atm,
            "ground_impact_j": terminal_e_kin,
            "atmospheric_ratio": atm_ratio,
            "ground_impact_ratio": ground_ratio,
        },
    };
}


// ============================================================
// Part 3: Disaster Modules + run_simulation Orchestrator
// 翻译对应：breakup / crater / shockwave / thermal / classify + simulation（v3.0 已移除 tsunami）
// 依赖：C (constants) 及 meteoroid/trajectory 等之前的全局函数
// ============================================================

// -------------------- breakup: determine_mode --------------------
function determine_mode(trajectory_result, diameter_m, material_key) {
    var term = trajectory_result["terminal"];
    var brk = trajectory_result["breakup"];
    var init_e = trajectory_result["initial"]["kinetic_energy_j"];

    var impact = term["impact_happened"];
    var triggered = brk["triggered"];

    var mode, ground_efficiency, release_energy, release_altitude_km;

    if (impact) {
        if (triggered) {
            mode = "地表撞击（解体后碎片云撞击）";
        } else {
            mode = "地表撞击（完整硬撞击）";
        }
        ground_efficiency = 1.0;
        release_energy = term["e_kinetic_j"];
        release_altitude_km = 0.0;
    } else if (triggered) {
        mode = "空爆（通古斯模式）";
        ground_efficiency = 0.85;
        release_energy = term["e_kinetic_j"];
        release_altitude_km = brk["altitude_km"];
    } else {
        mode = "大气烧毁（无地面影响）";
        ground_efficiency = 0.0;
        release_energy = 0.0;
        release_altitude_km = trajectory_result["energy_peak_h_km"];
    }

    var rho_body = C.MATERIALS[material_key]["density"];
    var r = diameter_m / 2.0;
    var mass_per_area = (4.0 / 3.0) * r * rho_body;
    var penetration_ratio = mass_per_area / C.ATM_COLUMN_MASS;

    return {
        "mode": mode,
        "ground_efficiency": ground_efficiency,
        "release_energy_j": release_energy,
        "release_altitude_km": release_altitude_km,
        "energy_atm_ratio": trajectory_result["energy_atm_ratio"],
        "ablation_ratio": trajectory_result["ablation_ratio"],
        "penetration_ratio": penetration_ratio,
        "material_strength_MPa":
            C.MATERIALS[material_key]["strength"] / 1.0e6,
        "breakup_altitude_km": triggered ? brk["altitude_km"] : null,
        "initial_kinetic_energy_j": init_e,
    };
}

// -------------------- crater: compute_crater --------------------
function compute_crater(diameter_m, material_key, velocity_kms, target,
                        impact_energy_j, mode) {
    if (mode.indexOf("空爆") !== -1 || mode.indexOf("烧毁") !== -1) {
        return {"crater_diameter_km": 0.0, "note": "空爆/烧毁模式无实体撞击，不形成撞击坑"};
    }

    var rho_i = C.MATERIALS[material_key]["density"];
    var rho_t = C.TARGET_DENSITY[target];
    var v_ms = velocity_kms * 1000.0;
    var sin_theta = 1.0;

    var D_t = 1.161 * Math.pow(rho_i / rho_t, 1.0 / 3.0)
          * Math.pow(diameter_m, 0.78) * Math.pow(v_ms, 0.44) * Math.pow(sin_theta, 1.0 / 3.0);
    var D_final = D_t * 1.25;
    return {"crater_diameter_km": D_final / 1000.0, "note": ""};
}

// -------------------- shockwave: compute_shockwave --------------------
function compute_shockwave(release_energy_j, ground_efficiency) {
    var e = release_energy_j * ground_efficiency;
    var tnt_kg = e * C.TNT_KG_PER_JOULE;
    var w13 = tnt_kg > 0 ? Math.pow(tnt_kg, 1.0 / 3.0) : 0.0;
    return {
        "core_radius_km":      (C.OVERPRESSURE_SCALED_DIST["core"]      * w13) / 1000.0,
        "secondary_radius_km": (C.OVERPRESSURE_SCALED_DIST["secondary"] * w13) / 1000.0,
        "outer_radius_km":     (C.OVERPRESSURE_SCALED_DIST["outer"]     * w13) / 1000.0,
        "tnt_kg": tnt_kg,
    };
}

// -------------------- thermal: compute_thermal --------------------
function compute_thermal(release_energy_j, ground_efficiency) {
    var e = release_energy_j * ground_efficiency;
    if (e <= 0) {
        return {"fireball_radius_km": 0.0, "burn_radius_km": 0.0};
    }
    var r_fireball = C.FIREBALL_COEFF * Math.pow(e, 1.0 / 3.0);
    var r_burn = Math.sqrt(e / (4.0 * Math.PI * C.THIRD_DEGREE_BURN_FLUENCE));
    return {
        "fireball_radius_km": r_fireball / 1000.0,
        "burn_radius_km": r_burn / 1000.0,
    };
}

// -------------------- classify: classify_disaster + observer_damage --------------------

    }
    if (diameter_m < 2000 || tnt_tons < 1e12) {
        return {"level": "大型灾变", "description": "1km级，区域性生态崩溃"};
    }
    return {"level": "灭绝级撞击", "description": "10km+，全球圈层破坏、生物大灭绝"};
}

function observer_damage(observer_distance_km, shock, thermal) {
    var d = observer_distance_km;
    if (d <= shock["core_radius_km"]) {
        return "位于核心摧毁区：地面汽化、完全毁灭";
    }
    if (d <= shock["secondary_radius_km"]) {
        return "位于次级区：建筑完全坍塌、林木焚毁";
    }
    if (d <= thermal["burn_radius_km"]) {
        return "位于热辐射烧伤区：三度烧伤、可燃物起火";
    }
    if (d <= shock["outer_radius_km"]) {
        return "位于外围区：玻璃震碎、轻度损毁";
    }
    return "位于安全区：基本无影响";
}

// -------------------- simulation: run_simulation 编排器 --------------------
function run_simulation(params) {
    var diameter = parseFloat(params["diameter"]);
    var material = params["material"];
    var velocity = parseFloat(params["velocity"]);
    var angle    = parseFloat(params["angle"]);
    var target   = "陆地";  // v3.0：强制陆地，忽略传入
    var depth    = parseFloat(params["depth"] !== undefined ? params["depth"] : 0);
    var obs_dist = parseFloat(params["observer_distance"] !== undefined ? params["observer_distance"] : 0);

    // 1. 初始质量与动能
    var mass0 = compute_mass(diameter, material);
    var e0 = compute_kinetic_energy(mass0, velocity);
    var tnt0_tons = joule_to_tnt_ton(e0);
    var tnt0_kg = joule_to_tnt_kg(e0);
    var fun_refs = compute_fun_references(tnt0_kg);

    // 2. 大气轨迹积分
    var traj = integrate_trajectory(
        diameter, material, velocity, angle,
        0.01, 50
    );

    // 3. 空爆/地撞判定
    var mode_info = determine_mode(traj, diameter, material);
    var release_e = mode_info["release_energy_j"];
    var ground_eff = mode_info["ground_efficiency"];

    // 4. 实际释放能量的 TNT 当量
    var tnt_release_tons = joule_to_tnt_ton(release_e);
    var tnt_release_kg = joule_to_tnt_kg(release_e);

    // 5. 撞击坑
    var crater_info = compute_crater(
        diameter, material, velocity, target, release_e, mode_info["mode"]
    );

    // 6. 冲击波
    var shock = compute_shockwave(release_e, ground_eff);

    // 7. 热辐射
    var ther = compute_thermal(release_e, ground_eff);

    // 9. 灾害等级
    var disaster = classify_disaster(diameter, tnt_release_tons);

    // 10. 观测点损毁评估
    var obs = observer_damage(obs_dist, shock, ther);

    return {
        "input_echo": {
            "diameter_m": diameter,
            "material": material,
            "velocity_kms": velocity,
            "angle_deg": angle,
            "target": target,
            "observer_distance_km": obs_dist,
        },
        "initial": {
            "mass_kg": mass0,
            "mass_tons": mass0 / 1000.0,
            "density_kg_m3": C.MATERIALS[material]["density"],
            "kinetic_energy_j": e0,
            "tnt_tons": tnt0_tons,
            "tnt_mt": tnt0_tons / 1e6,
            "fun_references": fun_refs,
        },
        "trajectory": traj,
        "mode": mode_info,
        "release": {
            "energy_j": release_e,
            "tnt_tons": tnt_release_tons,
            "tnt_mt": tnt_release_tons / 1e6,
            "ground_efficiency": ground_eff,
        },
        "crater": crater_info,
        "shockwave": shock,
        "thermal": ther,
        "disaster_level": disaster,
        "observer_damage": obs,
    };
}
