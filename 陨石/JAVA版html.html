urst_only": "", "surface_only": "铁陨石凭借其坚固的质地，并未完全在空中解体，最终以较完整的形态撞击地面，形成一个较小的撞击坑。撞击瞬间，地面被砸出一个浅坑，溅射出的泥土和岩石碎片飞向四周，扬尘可达数十米高。", "land_extra": "在着陆点附近，建筑玻璃可能被震碎，树木可能被冲击波折断，地面上会出现明显的撞击痕迹，并伴有短暂的局部地震。", "ocean_extra": "", "visual_cue": "地面扬起尘土，微坑形成", "warning_note": "E<100万吨TNT，L1级别，适用于小型铁陨石地表撞击事件，影响范围有限。"}, {"rule_id": "L2-airburst-ice-land-G1", "level": "L2", "impact_type": "airburst", "material": "ice", "target": "land", "angle_group": "G1", "e_min": 1000000.0, "e_max": 1000000000.0, "disaster_title": "小型灾害", "main_text": "一颗冰彗星以低角度斜掠大气层，在约{{breakup_altitude}}公里的高空发生剧烈解体，剩余质量比例仅剩{{remain_mass_ratio}}。由于冰质结构疏松，大部分能量在高层大气中释放，形成耀眼火球与剧烈冲击波。", "angle_desc": "浅角度斜掠入射，能量沿水平方向扩散，垂直冲击效应减弱，热辐射与冲击波在更大范围内分散。", "airburst_only": "空中爆炸产生的火球照亮天际，冲击波以爆炸点为中心向外扩散，未触及地面的碎片在空中烧蚀殆尽，仅留下高空碎块云与持续的轰鸣。", "surface_only": "", "land_extra": "陆地表面未形成空中冲击波，但冲击波可能造成大面积玻璃破碎、树木倒伏，并引发局部火灾风险。", "ocean_extra": "", "visual_cue": "高空火球闪爆，碎块云扩散", "warning_note": "适用于E在1.0e+06至1.0e+09吨TNT、L2级别、冰质彗星低角度空中解体事件，注意与地表撞击区分。"}, {"rule_id": "L2-airburst-ice-land-G2", "level": "L2", "impact_type": "airburst", "material": "ice", "target": "land", "angle_group": "G2", "e_min": 1000000.0, "e_max": 1000000000.0, "disaster_title": "小型灾害", "main_text": "一颗直径约{{diameter}}米的冰彗星以{{velocity}}公里/秒的速度斜掠大气层，入射角{{angle}}度。由于冰质结构疏松，它在{{breakup_altitude}}公里高空开始剧烈解体，仅剩{{remain_mass_ratio}}的质量抵达低空。解体瞬间释放出相当于{{final_tnt}}吨TNT的能量，形成耀眼火球。", "angle_desc": "标准倾斜入射，冲击分布均衡，能量沿路径横向扩散。", "airburst_only": "冰彗星在高层大气中完全烧蚀，未触及地面，无高空解体冲击波扩散。空中爆炸产生强烈的冲击波和热辐射，对地表造成广泛影响。", "surface_only": "", "land_extra": "爆炸冲击波可能震碎玻璃、掀翻屋顶，森林区域可能引发火灾，地面无明显爆炸球壳，但建筑物可能受损。", "ocean_extra": "", "visual_cue": "高空耀目火球，冲击波云环扩散", "warning_note": "E<10^9吨TNT，L2级别，适用于冰质天体高空空爆事件，主要影响区域为爆炸点下方陆地。"}, {"rule_id": "L2-airburst-ice-land-G3", "level": "L2", "impact_type": "airburst", "material": "ice", "target": "land", "angle_group": "G3", "e_min": 1000000.0, "e_max": 1000000000.0, "disaster_title": "小型灾害", "main_text": "一颗直径约{{diameter}}米的冰彗星以{{velocity}}公里/秒的速度闯入大气层，入射角近垂直，如同天降利刃。冰质结构在高温中迅速崩解，于约{{breakup_altitude}}公里高空发生猛烈空爆，剩余质量仅{{remain_mass_ratio}}%。爆炸瞬间释放出相当于{{final_tnt}}吨TNT的能量，炽热冲击波以爆心为球心向外急剧扩散。", "angle_desc": "天体以接近垂直的角度切入大气，能量垂直向下传递，高空爆心正下方的地面承受最强冲击。", "airburst_only": "冰彗星在高层大气中解体为炽热碎块云，火球直径达{{fireball_r}}公里，热辐射瞬间灼烤下方区域，冲击波核心半径{{blast_core_r}}公里，外沿影响至{{blast_outer_r}}公里，但未接低空爆炸面，无爆炸球壳形成。", "surface_only": "", "land_extra": "爆心下方森林大面积燃烧，建筑物玻璃尽碎，部分老旧房屋倒塌，地面震动持续数秒，但未留下空中冲击。", "ocean_extra": "", "visual_cue": "垂直天降白光，空中火球爆散", "warning_note": "E在1e6至1e9吨TNT之间，L2级空爆，适用于冰质天体近垂直入射的陆地空中解体事件。"}, {"rule_id": "L2-airburst-rock-land-G1", "level": "L2", "impact_type": "airburst", "material": "rock", "target": "land", "angle_group": "G1", "e_min": 1000000.0, "e_max": 1000000000.0, "disaster_title": "小型灾害", "main_text": "一颗直径约{{diameter}}米的岩石陨石以{{angle}}度浅角斜掠大气层，速度{{velocity}}公里/秒。由于入射角极小，它在高层大气中经历了漫长而剧烈的摩擦，剩余质量仅{{remain_mass_ratio}}，在约{{breakup_altitude}}公里高空发生猛烈空爆。巨大的动能瞬间转化为热辐射和冲击波，天空被照得如同白昼，地面上的建筑物玻璃纷纷碎裂，树木被气浪连根拔起。", "angle_desc": "浅角度斜掠大气层，能量沿水平方向扩散，纵向冲击较弱，但热辐射覆盖范围更广。", "airburst_only": "在高空爆炸的瞬间，一个直径{{fireball_r}}公里的炽热火球在高空膨胀，强烈的热辐射让下方地面温度骤升，易燃物被点燃。冲击波以超音速向外扩散，造成{{blast_core_r}}公里核心区内建筑物严重损毁，{{blast_outer_r}}公里范围内玻璃震碎。由于是空中解体，没有形成任何空中冲击波，只留下高空碎块云和持续数分钟的余辉。", "surface_only": "", "land_extra": "陆地地区首当其冲受到冲击波和热辐射的袭击，城市建筑受损严重，森林边缘出现大面积烧灼痕迹。地震仪记录到持续数分钟的微震，但未造成明显的地表断裂。", "ocean_extra": "", "visual_cue": "高空火球连闪，冲击波云环扩散", "warning_note": "E在1e6~1e9吨TNT，L2级别，适用于浅角空爆陆地事件，能量分散，不产生空中冲击。"}, {"rule_id": "L2-airburst-rock-land-G2", "level": "L2", "impact_type": "airburst", "material": "rock", "target": "land", "angle_group": "G2", "e_min": 1000000.0, "e_max": 1000000000.0, "disaster_title": "小型灾害", "main_text": "一块直径约{{diameter}}米的岩石陨石以{{velocity}}公里/秒的速度闯入大气层，入射角约{{angle}}度。由于岩石中等结构，它在高空发生剧烈解体，剩余质量比仅为{{remain_mass_ratio}}，在{{breakup_altitude}}公里高度处产生强烈空爆。巨大的火球照亮天空，冲击波以超音速向外扩散，热辐射灼烤大地，虽未直接在大气层内剧烈爆炸，但能量释放仍造成广泛影响。", "angle_desc": "以中等倾斜角度（30~60°）切入大气层，能量分布较为均衡，冲击波呈锥形扩散，地面受影响范围较对称。", "airburst_only": "空中火球迅速膨胀，形成直径约{{fireball_r}}公里的炽热气团，强烈的热辐射使下方地面温度骤升，冲击波在数十公里外仍能震碎玻璃、掀翻屋顶，但未形成空中冲击。", "surface_only": "", "land_extra": "在陆地，空爆冲击波可导致森林倒伏、建筑物部分坍塌，地面可能产生裂缝，但无直接高空解体冲击波扩散。", "ocean_extra": "", "visual_cue": "高空火球闪烁，冲击波云环扩散", "warning_note": "适用于能量在100万吨至10亿吨TNT之间、岩石质天体在陆地高空解体的小型灾害事件，冲击波和热辐射为主要破坏因素。"}, {"rule_id": "L2-airburst-rock-land-G3", "level": "L2", "impact_type": "airburst", "material": "rock", "target": "land", "angle_group": "G3", "e_min": 1000000.0, "e_max": 1000000000.0, "disaster_title": "小型灾害", "main_text": "一颗直径约{{diameter}}米的岩石陨石以{{velocity}}公里/秒的速度、接近垂直的角度冲入大气层。高空剧烈摩擦使其迅速升温，在{{breakup_altitude}}公里高度发生猛烈解体，剩余质量仅为初始的{{remain_mass_ratio}}。瞬间爆发出耀眼火球，释放出相当于{{final_tnt}}万吨TNT的能量，强大的冲击波和热辐射向四周扩散。", "angle_desc": "接近垂直入射，能量纵向集中，高空爆炸点较深，冲击波向下传递更直接。", "airburst_only": "火球在空中绽放，巨大的冲击波以爆心为球心向外横扫，地面上的建筑和树木被强风吹倒，但并未形成空中冲击。", "surface_only": "", "land_extra": "冲击波导致大片森林倒伏，城市玻璃幕墙破碎，老旧建筑可能坍塌，地面震动明显，但无陨石坑形成。", "ocean_extra": "", "visual_cue": "天空闪现刺眼白昼光，火球膨胀", "warning_note": "适用于岩石陨石高空空爆，陆地目标，陡角度入射，TNT当量在1e6至1e9吨之间，L2级小型灾害。"}, {"rule_id": "L2-airburst-iron-land-G1", "level": "L2", "impact_type": "airburst", "material": "iron", "target": "land", "angle_group": "G1", "e_min": 1000000.0, "e_max": 1000000000.0, "disaster_title": "小型灾害", "main_text": "一颗直径约{{diameter}}米、速度{{velocity}}公里/秒的铁陨石以浅角度斜掠大气层，由于铁质结构致密，其抗烧蚀能力较强，但浅角度入射使得能量在高层大气中横向扩散，未能深入低空。在{{breakup_altitude}}公里高空，主体发生剧烈解体，剩余质量仅为初始的{{remain_mass_ratio}}，释放出相当于{{final_tnt}}吨TNT的能量。", "angle_desc": "浅角度斜掠大气层，能量横向扩散，纵向集中弱，冲击效应分散。", "airburst_only": "空中解体形成的火球在高空迅速膨胀，冲击波沿水平方向传播，热辐射向下辐射，但未触及地面形成任何爆炸球壳。", "surface_only": "", "land_extra": "陆地上，冲击波可能造成大范围玻璃破碎、树木倒伏，但无直接高空解体冲击波扩散。", "ocean_extra": "", "visual_cue": "高空耀眼光球，横向冲击波", "warning_note": "E在1e6~1e9吨TNT区间，L2级别，适用于铁陨石浅角度空爆事件，无地面空中冲击。"}, {"rule_id": "L2-airburst-iron-land-G2", "level": "L2", "impact_type": "airburst", "material": "iron", "target": "land", "angle_group": "G2", "e_min": 1000000.0, "e_max": 1000000000.0, "disaster_title": "小型灾害", "main_text": "一枚直径约{{diameter}}米的铁质陨石以{{velocity}}公里/秒的速度、{{angle}}°的倾角切入大气层。由于其致密坚固的材质，大部分星体在穿越大气层时并未完全烧蚀，最终仍有{{remain_mass_ratio}}的质量残余，在约{{breakup_altitude}}公里的高空发生剧烈空爆。爆炸当量相当于{{final_tnt}}吨TNT，迸发出耀眼的火球与冲击波，向四周扩散。", "angle_desc": "标准倾斜入射（30~60°），冲击分布均衡，能量释放较为均匀。", "airburst_only": "铁陨石的坚固结构使其在高空解体时仍保持较高完整性，爆炸产生的高温热辐射与强烈冲击波席卷下方陆地，但并未触及地面形成空中冲击。", "surface_only": "", "land_extra": "在陆地，冲击波掀翻建筑物屋顶，震碎大范围玻璃窗，森林边缘树木被拦腰折断，并可能引发局部地震与火灾。", "ocean_extra": "", "visual_cue": "高空火球与冲击波扩散", "warning_note": "适用于L2级别高空空爆事件（E≥1.0e+06吨TNT，E<1.0e+09吨TNT），铁质陨石，陆地目标，中等倾角。"}, {"rule_id": "L2-airburst-iron-land-G3", "level": "L2", "impact_type": "airburst", "material": "iron", "target": "land", "angle_group": "G3", "e_min": 1000000.0, "e_max": 1000000000.0, "disaster_title": "小型灾害", "main_text": "一枚直径约{{diameter}}米的铁质小行星以{{velocity}}公里/秒的速度近乎垂直切入大气层，入射角约{{angle}}度。由于铁陨石结构致密，在穿越大气层时虽部分烧蚀，仍有约{{remain_mass_ratio}}的质量保留，最终在海拔{{breakup_altitude}}公里处发生剧烈空爆，释放出相当于{{final_tnt}}吨TNT的能量，形成一个巨大的空中火球。", "angle_desc": "G3陡角度（60~90°）：近垂直入射，能量纵向集中，大气路径短，空爆高度相对较低，冲击波向下传播更直接。", "airburst_only": "铁质天体在高层大气中解体，并未接低空爆炸面形成空中冲击。空爆产生的冲击波和热辐射猛烈冲击地面，建筑物玻璃破碎、树木被连根拔起，但地面仅出现烧灼痕迹，无爆炸球壳形成。", "surface_only": "", "land_extra": "空爆冲击波横扫陆地，城市建筑立面受损，玻璃碎片飞溅，森林区域可能引发大面积火灾，局部地区出现地层震动但无高空压缩形成。", "ocean_extra": "", "visual_cue": "火球划破天际，巨大冲击波扩散", "warning_note": "L2级空爆，铁陨石，陆地目标，G3陡角。适用于空爆但能量较高、可能造成地面建筑破坏的事件。"}, {"rule_id": "L2-surface-ice-land-G1", "level": "L2", "impact_type": "surface", "material": "ice", "target": "land", "angle_group": "G1", "e_min": 1000000.0, "e_max": 1000000000.0, "disaster_title": "小型灾害", "main_text": "一颗直径约{{diameter}}米的冰彗星以{{velocity}}公里/秒的速度、{{angle}}度浅角斜掠大气层。由于冰质结构疏松，它在{{breakup_altitude}}公里高空已损失约{{remain_mass_ratio}}的质量，但仍有残余碎片撞击地面，形成一个规模可观的撞击坑。撞击瞬间释放约{{final_tnt}}吨TNT当量的能量，产生强烈的冲击波和热辐射。", "angle_desc": "浅角度斜掠大气层，能量横向扩散，纵向集中较弱，但地表破坏范围较大。", "airburst_only": "", "surface_only": "残余冰体碎片以一定角度砸入地面，形成一个明显的撞击坑，坑体周围的地表被翻起，碎石飞溅，冲击波以撞击点为中心向四周扩散。", "land_extra": "撞击点附近的建筑物玻璃碎裂、墙体开裂，森林边缘树木被冲击波拦腰折断，地面出现明显震动，部分区域可能引发局部地震。", "ocean_extra": "", "visual_cue": "浅角撞击掀起漫天尘柱", "warning_note": "适用于E在1e6~1e9吨TNT之间、浅角度地表撞击的冰彗星事件，L2级别，影响范围有限。"}, {"rule_id": "L2-surface-ice-land-G2", "level": "L2", "impact_type": "surface", "material": "ice", "target": "land", "angle_group": "G2", "e_min": 1000000.0, "e_max": 1000000000.0, "disaster_title": "小型灾害", "main_text": "一颗直径约{{diameter}}米的冰彗星以{{velocity}}公里/秒的速度冲入大气层。由于冰质结构疏松，它在高空就开始剧烈烧蚀，但仍有约{{remain_mass_ratio}}的质量存留至解体高度{{breakup_altitude}}公里处。随着一声闷响，它最终以{{angle}}度的倾角撞击地面，激起大量冰尘与碎屑，冲击波与热辐射瞬间席卷周围区域。", "angle_desc": "标准倾斜入射（30~60度），冲击分布均衡，能量传递稳定。", "airburst_only": "", "surface_only": "冰体撞击地面，形成了一个浅而宽的撞击坑，坑缘翻卷出湿润的土壤和融化的冰水混合物。由于冰体在入过程中已部分解体，撞击坑的规模相对较小，但溅射物覆盖范围却异常广泛。", "land_extra": "撞击点附近的建筑玻璃窗瞬间碎裂，森林边缘的树木被冲击波拦腰折断，地面出现明显的震动，部分老旧房屋的墙体产生裂缝。扬起的尘埃与冰雾混合，导致能见度骤降。", "ocean_extra": "", "visual_cue": "白色冰雾蘑菇云升腾", "warning_note": "E介于1.0e+06至1.0e+09吨TNT，L2级别，适用于冰质天体中等角度陆地撞击事件，注意冰体可能引发局部火球与冰尘效应。"}, {"rule_id": "L2-surface-ice-land-G3", "level": "L2", "impact_type": "surface", "material": "ice", "target": "land", "angle_group": "G3", "e_min": 1000000.0, "e_max": 1000000000.0, "disaster_title": "小型灾害", "main_text": "一颗直径约{{diameter}}米的冰彗星以{{angle}}°的陡峭角度高速撞向陆地，速度高达{{velocity}}公里/秒。由于冰质结构疏松，它在高空已部分解体，但仍有{{remain_mass_ratio}}的质量残留，并在{{breakup_altitude}}公里的高度发生剧烈碎裂。最终，主体冰核砸入地面，形成巨大的撞击坑，瞬间释放出相当于{{final_tnt}}吨TNT的能量，冲击波与热浪席卷方圆数公里。", "angle_desc": "近垂直入射，能量纵向高度集中，穿透力强，撞击坑深度与破坏力显著提升。", "airburst_only": "", "surface_only": "冰彗星主体直接撞击地面，在接触点炸裂出直径约{{crater_r}}米的撞击坑，坑缘溅射大量碎冰与泥土，冲击波以超音速向外扩散，摧毁半径{{blast_core_r}}公里内的所有建筑，并在{{blast_outer_r}}公里范围内造成严重破坏。", "land_extra": "陆地上，撞击点附近森林瞬间被点燃，形成大面积火海；建筑物在冲击波中倒塌，地面剧烈震动如同强震，裂缝延伸数公里，扬尘遮天蔽日。", "ocean_extra": "", "visual_cue": "白色冰火球砸地，蘑菇云腾起", "warning_note": "适用于L2级（1e6~1e9吨TNT）、冰质天体、陆地、陡角度（60~90°）地表撞击事件，注意冰质易碎裂，能量释放更分散。"}, {"rule_id": "L2-surface-rock-land-G1", "level": "L2", "impact_type": "surface", "material": "rock", "target": "land", "angle_group": "G1", "e_min": 1000000.0, "e_max": 1000000000.0, "disaster_title": "小型灾害", "main_text": "一颗直径约{{diameter}}米的岩石陨石以{{velocity}}公里/秒的速度斜掠进入大气层，入射角约{{angle}}度。由于角度浅，它在高空经历了漫长的摩擦与烧蚀，剩余质量仅为原始的{{remain_mass_ratio}}，在约{{breakup_altitude}}公里的高度发生部分解体。但仍有相当质量的碎片继续飞向地面，最终以低角度撞击陆地，形成显著的撞击坑。", "angle_desc": "浅角度斜掠入射，能量在大气层中横向扩散，纵向冲击相对较弱，但地面效应依然明显。", "airburst_only": "", "surface_only": "陨石碎片以低角度砸入地面，激起大量碎石和尘土，撞击坑边缘隆起，周围数百米内建筑物玻璃破碎、墙体开裂。", "land_extra": "撞击点附近的森林可能被冲击波掀倒，地面出现明显震动，震感可传至数十公里外。", "ocean_extra": "", "visual_cue": "低角度火球划过天际，地面尘土飞扬", "warning_note": "E介于100万吨TNT至10亿吨TNT之间，L2级别，适用于浅角度岩石陨石地表撞击事件，注意冲击波和地面震动。"}, {"rule_id": "L2-surface-rock-land-G2", "level": "L2", "impact_type": "surface", "material": "rock", "target": "land", "angle_group": "G2", "e_min": 1000000.0, "e_max": 1000000000.0, "disaster_title": "小型灾害", "main_text": "一颗直径约{{diameter}}米的岩石陨石以{{velocity}}公里/秒的速度、{{angle}}°的角度切入大气层。由于材质为岩石，它在高空发生了部分解体，但仍有约{{remain_mass_ratio}}的质量存留至约{{breakup_altitude}}公里的高度。最终，这块岩石以标准倾斜轨迹砸向地面，撞击点瞬间爆发出相当于{{final_tnt}}吨TNT的能量，形成一个明显的撞击坑。", "angle_desc": "中等角度（30°~60°）标准倾斜入射，冲击波与热辐射在地面形成较为均匀的分布，破坏范围呈现对称的椭圆形。", "airburst_only": "", "surface_only": "岩石陨石以标准倾斜角度撞击地面，瞬间形成直径约{{crater_r}}米的撞击坑，坑缘碎石飞溅，强烈的冲击波以撞击点为中心向外扩散，烧毁约{{burn_r}}米范围内的植被，并摧毁{{blast_core_r}}米内的建筑物。", "land_extra": "陆地表面遭受严重破坏：撞击点附近的建筑物在{{blast_core_r}}米半径内完全倒塌，森林在{{burn_r}}米半径内被热辐射引燃，地面震动等效于一场地震，震感波及周围数十公里。", "ocean_extra": "", "visual_cue": "橙红火球砸向地面，烟柱升腾", "warning_note": "适用于L2级岩石陨石地表撞击陆地场景（E=1.0e+06~1.0e+09吨TNT），标准倾斜入射角（30°~60°），可能引发局部地震和火灾。"}, {"rule_id": "L2-surface-rock-land-G3", "level": "L2", "impact_type": "surface", "material": "rock", "target": "land", "angle_group": "G3", "e_min": 1000000.0, "e_max": 1000000000.0, "disaster_title": "小型灾害", "main_text": "一块直径约{{diameter}}米的岩石陨石以{{velocity}}公里/秒的速度，以{{angle}}°的陡峭角度直插大地。由于角度接近垂直，大气阻力对其减速效果有限，陨石以极高动能穿透大气层，最终约有{{remain_mass_ratio}}的质量残存至低空，在约{{breakup_altitude}}公里的高度发生剧烈解体，但核心碎片仍以超高速砸向地表。撞击瞬间释放出相当于{{final_tnt}}吨TNT的能量，形成一个巨大的火球，地面剧烈震动，冲击波以超音速向外扩散。", "angle_desc": "近垂直入射，能量高度集中，穿透力极强，撞击深度和破坏范围在同类中最大。", "airburst_only": "", "surface_only": "撞击发生时，地面被砸出一个巨大的撞击坑，坑缘溅射物飞溅数公里，坑体深度可达数十米。冲击波掀翻周围数公里内的建筑，树木成片倒伏，地表岩石被强烈挤压变形。", "land_extra": "撞击点周围数十公里内的建筑物将遭受毁灭性破坏，玻璃幕墙瞬间破碎，砖石结构倒塌；森林区域可能引发大面积火灾，同时强烈地震波会在地表传播，造成地面裂缝和山体滑坡。", "ocean_extra": "", "visual_cue": "炽白火球腾空，蘑菇云升腾", "warning_note": "适用于L2级地表撞击（能量1e6~1e9吨TNT），岩石材质、陆地目标、陡角入射，可能造成区域性灾害。"}, {"rule_id": "L2-surface-iron-land-G1", "level": "L2", "impact_type": "surface", "material": "iron", "target": "land", "angle_group": "G1", "e_min": 1000000.0, "e_max": 1000000000.0, "disaster_title": "小型灾害", "main_text": "一颗铁质陨石以浅角度斜掠入大气层，致密的铁核抵抗了高温烧蚀，最终有 {{remain_mass_ratio}} 的质量残留并穿透至 {{breakup_altitude}} 公里的低空。它并未完全解体，而是带着残余动能猛烈撞击地面，掀起一场局部性灾害。", "angle_desc": "浅角度斜掠入射，能量沿水平方向扩散，纵向冲击较弱，但热辐射与冲击波覆盖范围呈长条形。", "airburst_only": "", "surface_only": "陨石以低角度撞击地面，瞬间形成一个撞击坑，坑体周围岩层被剧烈挤压碎裂。冲击波以近水平方向横扫，对地表建筑和植被造成严重破坏。", "land_extra": "陆地表面遭受直接冲击，撞击点附近建筑物倒塌，树木被连根拔起，地面震动引发局部山体滑坡和裂缝。", "ocean_extra": "", "visual_cue": "低角度火球拖尾，撞击扬起尘柱", "warning_note": "适用于小当量（10万吨至10亿吨TNT）铁陨石陆地浅角度撞击事件，L2级别，注意局部破坏与次生灾害。"}, {"rule_id": "L2-surface-iron-land-G2", "level": "L2", "impact_type": "surface", "material": "iron", "target": "land", "angle_group": "G2", "e_min": 1000000.0, "e_max": 1000000000.0, "disaster_title": "小型灾害", "main_text": "一颗铁质小行星以标准倾斜角度贯穿大气层，由于铁质结构的致密坚固，它抵抗住了剧烈的空气摩擦，仅烧蚀掉小部分质量，残存质量比例保持在{{remain_mass_ratio}}左右。它在{{breakup_altitude}}千米的高度仍保持完整结构，最终以极高的速度撞击地面。", "angle_desc": "标准倾斜入射，冲击分布均衡，能量在纵向和横向之间取得平衡。", "airburst_only": "", "surface_only": "撞击发生时，地面瞬间被巨大的力量掀开，形成一个明显的撞击坑，碎裂的岩层和泥土被抛向高空，冲击波以超音速向四周扩散，摧毁了半径数公里内的所有建筑和森林。", "land_extra": "陆地上，撞击点周围的建筑在冲击波中化为废墟，森林被点燃，大地剧烈震颤，裂缝从坑缘向外延伸，造成大面积地表破坏。", "ocean_extra": "", "visual_cue": "橙红火球撞击地面，尘土冲天", "warning_note": "E≥100万吨TNT，L2级别，适用于铁质天体标准角度陆地撞击事件。"}, {"rule_id": "L2-surface-iron-land-G3", "level": "L2", "impact_type": "surface", "material": "iron", "target": "land", "angle_group": "G3", "e_min": 1000000.0, "e_max": 1000000000.0, "disaster_title": "小型灾害", "main_text": "一颗直径约{{diameter}}米的铁陨石以{{velocity}}公里/秒的速度，以约{{angle}}°的陡角切入大气层。由于铁质结构极其致密坚固，它在高层大气中几乎未发生显著解体，最终仍有{{remain_mass_ratio}}的质量残余，直至在{{breakup_altitude}}公里高度才发生剧烈空爆，但主体仍保持完整并高速砸向地面。", "angle_desc": "接近垂直入射，能量纵向集中，穿透力极强，冲击波沿入射方向深达地下。", "airburst_only": "", "surface_only": "铁陨石主体以极高动能猛烈撞击地面，瞬间形成巨大的撞击坑。冲击波以超音速向四周扩散，在核心区{{blast_core_r}}公里范围内地面被掀起，建筑物悉数摧毁；在{{blast_outer_r}}公里半径内玻璃震碎、树木连根拔起。撞击点周围{{burn_r}}公里内因撞击产生的高温熔融物质喷洒，引发大规模火灾。", "land_extra": "陆地上，撞击坑边缘的岩层被剧烈挤压变形，产生强烈地震，震感波及数百公里。森林地带引发大面积山火，城市基础设施瘫痪，通讯中断。", "ocean_extra": "", "visual_cue": "巨型蘑菇云腾空而起，地面剧烈震颤", "warning_note": "E介于1e6~1e9吨TNT，L2级，铁陨石陡角地表撞击，适用于陆地目标，注意撞击坑与强震效应。"}, {"rule_id": "L3-airburst-ice-land-G1", "level": "L3", "impact_type": "airburst", "material": "ice", "target": "land", "angle_group": "G1", "e_min": 1000000000.0, "e_max": 1000000000000.0, "disaster_title": "中型灾难", "main_text": "一颗直径约{{diameter}}公里的冰彗星以{{velocity}}公里/秒的速度斜掠进入大气层，入射角仅{{angle}}度。由于冰质结构疏松，它在高层大气中迅速升温并开始解体，剩余质量仅{{remain_mass_ratio}}，最终在约{{breakup_altitude}}公里的高空发生剧烈空爆。", "angle_desc": "浅角度斜掠入射，能量沿横向扩散，纵向冲击较弱。", "airburst_only": "冰彗星在空中解体，形成巨大的火球，热辐射和冲击波以高空为中心向四周扩散，未触及地面。", "surface_only": "", "land_extra": "冲击波抵达地面时，可能造成建筑物玻璃破碎、树木倾倒，并引发局部地震，但无高空解体冲击波扩散。", "ocean_extra": "", "visual_cue": "冰蓝火球划破长空", "warning_note": "适用于L3级空中解体事件，冰质彗星、浅角度入射，能量释放集中在高空。"}, {"rule_id": "L3-airburst-ice-land-G2", "level": "L3", "impact_type": "airburst", "material": "ice", "target": "land", "angle_group": "G2", "e_min": 1000000000.0, "e_max": 1000000000000.0, "disaster_title": "中型灾难", "main_text": "一颗直径约 {{diameter}} 米的冰彗星以 {{velocity}} 公里/秒的速度闯入大气层，入射角约 {{angle}}°。由于冰质结构疏松，它在高空便剧烈烧蚀，解体成无数碎块。到达 {{breakup_altitude}} 公里高度时，剩余质量仅为初始质量的 {{remain_mass_ratio}}。", "angle_desc": "标准倾斜入射，冲击分布均衡，空爆冲击波向四周均匀扩散。", "airburst_only": "冰彗星在高空发生剧烈空爆，形成一个直径约 {{fireball_r}} 公里的炽热火球，强烈的热辐射瞬间灼烧下方地面。冲击波以超压形式向外扩散，摧毁范围达 {{blast_core_r}} 公里核心区，影响至 {{blast_outer_r}} 公里外。没有形成空中冲击波，但热辐射和冲击波对地表建筑和植被造成巨大破坏。", "surface_only": "", "land_extra": "陆地上，爆炸冲击波掀翻建筑屋顶，森林大面积倒伏，并引发局部地震，震感明显。", "ocean_extra": "", "visual_cue": "耀眼白光闪过，蘑菇云腾空", "warning_note": "适用于E在1.0e+09~1.0e+12吨TNT的冰质小行星空中解体事件，L3级，注意高空爆炸效应。"}, {"rule_id": "L3-airburst-ice-land-G3", "level": "L3", "impact_type": "airburst", "material": "ice", "target": "land", "angle_group": "G3", "e_min": 1000000000.0, "e_max": 1000000000000.0, "disaster_title": "中型灾难", "main_text": "一枚直径约{{diameter}}米的冰质彗星以{{velocity}}公里/秒的速度、{{angle}}度陡角切入大气层。由于冰体结构疏松，在高层大气中迅速升温解体，约{{remain_mass_ratio}}的质量在{{breakup_altitude}}公里高空烧蚀殆尽，释放出相当于{{final_tnt}}吨TNT的巨大能量。", "angle_desc": "近垂直入射，能量纵向集中，但冰体易碎，高空爆破碎片云垂直扩散。", "airburst_only": "空中形成一个直径约{{fireball_r}}公里的炽热火球，瞬间照亮天际。冲击波以{{blast_core_r}}公里为核心半径向外横扫，{{blast_outer_r}}公里范围内建筑物玻璃尽碎，热辐射可灼烧{{burn_r}}公里内的植被。天空中留下巨大的碎块云和烟尘带。", "surface_only": "", "land_extra": "陆地表面虽未形成空中冲击波，但冲击波引发强烈地动，森林大面积倒伏，城市建筑受损严重，并可能诱发山体滑坡和局部地震。", "ocean_extra": "", "visual_cue": "炽白火球垂直炸裂，冲击波环形扩散", "warning_note": "适用于L3级别、冰质彗星陡角高空空爆的陆地事件，能量范围1e9~1e12吨TNT。"}, {"rule_id": "L3-airburst-rock-land-G1", "level": "L3", "impact_type": "airburst", "material": "rock", "target": "land", "angle_group": "G1", "e_min": 1000000000.0, "e_max": 1000000000000.0, "disaster_title": "中型灾难", "main_text": "一颗直径约{{diameter}}米的岩石陨石以{{velocity}}公里/秒的速度斜掠大气层，入射角约{{angle}}度。由于浅角度穿越大气路径较长，摩擦加热剧烈，陨石在高度{{breakup_altitude}}公里处发生剧烈解体，大量碎片燃烧殆尽，最终仅有{{remain_mass_ratio}}的质量残余。空中爆炸释放出约{{final_tnt}}百万吨TNT当量的能量，形成直径{{fireball_r}}公里的炽热火球，强烈的冲击波覆盖核心区{{blast_core_r}}公里、外围影响区{{blast_outer_r}}公里，热辐射可致{{burn_r}}公里内物体燃烧。", "angle_desc": "浅角度斜掠大气层，能量横向扩散明显，纵向穿透能力弱，主要影响集中在中高层大气。", "airburst_only": "爆炸发生在高空，没有形成空中冲击波，但巨大的冲击波和热辐射仍对地表造成广泛破坏。天空被照得如同白昼，冲击波以超音速向外扩散，所到之处建筑物玻璃尽碎，树木被连根拔起，大片森林被点燃。", "surface_only": "", "land_extra": "陆地上的人口密集区遭受严重冲击，城市中大量建筑因冲击波和热辐射受损，森林区域可能引发大面积火灾，并伴随强烈的地表震动感。", "ocean_extra": "", "visual_cue": "高空火球照亮天际，冲击波环扩散", "warning_note": "适用于L3级岩石陨石空中解体事件，能量范围1E9至1E12吨TNT，浅角度入射，陆地目标。"}, {"rule_id": "L3-airburst-rock-land-G2", "level": "L3", "impact_type": "airburst", "material": "rock", "target": "land", "angle_group": "G2", "e_min": 1000000000.0, "e_max": 1000000000000.0, "disaster_title": "中型灾难", "main_text": "一颗直径约{{diameter}}米的岩石陨石以{{velocity}}公里/秒的速度闯入大气层，入射角约{{angle}}度。由于岩石材质中等坚固，它并未完全烧蚀，最终在{{breakup_altitude}}公里的高空发生剧烈解体，剩余质量约为原质量的{{remain_mass_ratio}}。空中绽放出耀眼火球，冲击波以超音速向四周扩散，地面建筑物玻璃尽碎，树木连根拔起。", "angle_desc": "中等倾斜入射，约30~60度，能量分布较为均衡，冲击波呈对称半球形扩散。", "airburst_only": "岩石陨石在高空解体，形成直径约{{fireball_r}}公里的火球，热辐射瞬间点燃地面可燃物，冲击波核心半径达{{blast_core_r}}公里，外围破坏范围延伸至{{blast_outer_r}}公里，但未形成空中冲击。", "surface_only": "", "land_extra": "陆地目标区域遭受严重破坏：城市建筑外墙坍塌，森林大火蔓延，强烈地震波导致地表裂缝，但无高空解体冲击波扩散。", "ocean_extra": "", "visual_cue": "橙红火球照亮天空，冲击波环形扩散", "warning_note": "适用于1亿吨至1千亿吨TNT当量，岩石质天体空中解体事件，撞击角度中等，陆地目标。"}, {"rule_id": "L3-airburst-rock-land-G3", "level": "L3", "impact_type": "airburst", "material": "rock", "target": "land", "angle_group": "G3", "e_min": 1000000000.0, "e_max": 1000000000000.0, "disaster_title": "中型灾难", "main_text": "一颗直径约{{diameter}}米的岩石陨石以{{velocity}}公里/秒的速度、接近垂直的角度（{{angle}}°）冲入大气层。由于岩石结构中等，部分碎片在高层大气中烧蚀，最终仅有{{remain_mass_ratio}}的质量抵达{{breakup_altitude}}公里的空中解体点，释放出相当于{{final_tnt}}吨TNT的能量。", "angle_desc": "接近垂直入射，能量纵向集中，空中冲击波直冲地面。", "airburst_only": "陨石在高层大气中剧烈解体，形成耀眼的火球和高速冲击波，未触及地面便已耗尽动能，因此没有形成任何空中冲击。", "surface_only": "", "land_extra": "冲击波将摧毁大片森林，震碎玻璃，并可能引发局部地震和火灾。", "ocean_extra": "", "visual_cue": "高空火球与冲击波环", "warning_note": "适用于100万吨至10亿吨TNT当量的空中解体事件，岩石材质，陆地目标，近垂直入射。"}, {"rule_id": "L3-airburst-iron-land-G1", "level": "L3", "impact_type": "airburst", "material": "iron", "target": "land", "angle_group": "G1", "e_min": 1000000000.0, "e_max": 1000000000000.0, "disaster_title": "中型灾难", "main_text": "一颗直径约{{diameter}}米的铁质陨石以{{velocity}}公里/秒的速度、{{angle}}度角斜掠入大气层。由于铁陨石致密坚固，它在高层大气中并未迅速解体，直到{{breakup_altitude}}公里高度才发生剧烈爆炸。爆炸瞬间释放出相当于{{final_tnt}}百万吨TNT的能量，仅{{remain_mass_ratio}}的残骸继续下落，大部分质量已在空中气化。巨大的火球照亮了半边天空，冲击波以超音速向四周扩散，尽管没有直接在大气层内剧烈爆炸，但空爆产生的热辐射和冲击波仍对地表造成毁灭性影响。", "angle_desc": "陨石以浅角度（5~30°）斜掠大气层，能量沿飞行路径横向扩散，纵向冲击效应相对减弱，但空中爆炸的波及范围更广。", "airburst_only": "铁陨石在空中爆炸，形成一个直径约{{fireball_r}}公里的炽热火球，热辐射瞬间点燃地表可燃物。冲击波在{{blast_core_r}}公里核心区内摧毁一切建筑物，在{{blast_outer_r}}公里外仍能震碎玻璃、掀翻车辆。由于是空爆，没有形成空中冲击波，但爆炸产生的碎块云和尘埃在高空蔓延，遮蔽阳光数日。", "surface_only": "", "land_extra": "陆地上，爆炸冲击波夷平森林和城镇，建筑物倒塌，引发大规模火灾。地面震动相当于一次浅源地震，但未形成空中冲击。", "ocean_extra": "", "visual_cue": "斜掠天际的巨大火球，冲击波扩散", "warning_note": "适用于L3级别、能量在10^9~10^12吨TNT的铁陨石空中爆炸事件，浅角度入射，重点表现冲击波和热辐射的广域破坏。"}, {"rule_id": "L3-airburst-iron-land-G2", "level": "L3", "impact_type": "airburst", "material": "iron", "target": "land", "angle_group": "G2", "e_min": 1000000000.0, "e_max": 1000000000000.0, "disaster_title": "中型灾难", "main_text": "一枚直径约{{diameter}}米的铁质小行星以{{velocity}}公里/秒的速度闯入大气层，入射角度约{{angle}}度。尽管铁质天体极其致密，但巨大的动能使其在约{{breakup_altitude}}公里高空骤然解体，剩余质量比例仅为{{remain_mass_ratio}}，大部分质量在极端高温中气化，形成耀眼的火球与冲击波，未能抵达地面。", "angle_desc": "标准倾斜入射，冲击分布均衡，能量释放过程较为平缓。", "airburst_only": "高空爆炸产生的冲击波以超音速向四周扩散，火球半径达{{fireball_r}}公里，热辐射引发地面大面积燃烧，但未形成空中冲击。", "surface_only": "", "land_extra": "陆地区域内，强烈冲击波摧毁了半径{{blast_outer_r}}公里内的建筑与森林，核心区域半径{{blast_core_r}}公里内几乎夷为平地，并诱发局地地震与火灾。", "ocean_extra": "", "visual_cue": "高空火球伴随冲击波扩散", "warning_note": "适用于L3级铁质天体高空解体事件，能量约10亿至万亿吨TNT，无地表空中冲击波，注意冲击波与热辐射效应。"}, {"rule_id": "L3-airburst-iron-land-G3", "level": "L3", "impact_type": "airburst", "material": "iron", "target": "land", "angle_group": "G3", "e_min": 1000000000.0, "e_max": 1000000000000.0, "disaster_title": "中型灾难", "main_text": "一颗直径约{{diameter}}米的铁质小行星以{{velocity}}公里/秒的速度、{{angle}}度的陡峭角度切入大气层。由于铁质结构致密，它并未如普通岩石那般迅速解体，而是以惊人的速度穿透大气，直到约{{breakup_altitude}}公里的高度才发生剧烈爆炸。爆炸瞬间释放的能量相当于{{final_tnt}}吨TNT，但仍有约{{remain_mass_ratio}}的质量残留，化为碎片云继续飞散。猛烈的空爆在天空中形成超亮火球，其半径达到{{fireball_r}}公里，热辐射足以引燃下方广袤区域（燃烧半径{{burn_r}}公里）。冲击波以超音速扩散，核心破坏半径{{blast_core_r}}公里，外圈破坏半径{{blast_outer_r}}公里，所到之处建筑物将遭受毁灭性打击。", "angle_desc": "近垂直入射，能量纵向集中，爆炸高度较低，地面效应更为强烈。", "airburst_only": "铁质天体的空爆发生在高层大气，没有形成空中冲击。爆炸产生的冲击波和热辐射是主要破坏方式，火球在天空中持续数秒，随后留下螺旋状的碎片云。", "surface_only": "", "land_extra": "陆地区域内，爆炸冲击波将导致大范围建筑玻璃震碎、墙体坍塌，森林瞬间被点燃，形成大面积火灾。地面可能产生剧烈震动，但不会出现空中冲击波，只会有散落的陨石碎片。", "ocean_extra": "", "visual_cue": "超亮火球撕裂天际，冲击波环扩散", "warning_note": "E介于1e9~1e12吨TNT，L3级别，铁质空爆，适用于陡角度近垂直入射的陆地事件，注意高空爆炸无爆炸球壳。"}, {"rule_id": "L3-surface-ice-land-G1", "level": "L3", "impact_type": "surface", "material": "ice", "target": "land", "angle_group": "G1", "e_min": 1000000000.0, "e_max": 1000000000000.0, "disaster_title": "中型灾难", "main_text": "一颗直径约{{diameter}}公里的冰彗星以{{velocity}}公里/秒的速度斜掠进入大气层，入射角仅{{angle}}度。由于冰质结构疏松，它在{{breakup_altitude}}公里高度便开始剧烈解体，大量碎块在高层大气中燃烧蒸发，最终仅有{{remain_mass_ratio}}的质量残存并砸向地面。低角度轨迹让能量沿路径横向扩散，但剩余的动能依然在落地瞬间引爆出相当于{{final_tnt}}百万吨TNT的恐怖释放。", "angle_desc": "浅角度斜掠入射，能量沿水平方向扩散，纵向冲击深度较浅。", "airburst_only": "", "surface_only": "冰彗星的残余核心带着裂解的碎块群撞击地面，在撞击点瞬时凿出一个巨大的撞击坑，坑体直径约{{crater_r}}公里。冲击波以超音速向外翻涌，将方圆{{blast_outer_r}}公里内的地表植被连根拔起，地面剧烈震颤，扬起数百米高的尘埃柱。由于冰体在撞击前已损失大量质量，坑体边缘残留着未完全熔融的冰屑，在高温下迅速汽化，形成短暂的白色蒸汽羽流。", "land_extra": "撞击点周边数十公里内的建筑物在冲击波中成片倒塌，玻璃碎片横飞；森林区域则瞬间燃起大火，火焰在热辐射下蔓延，{{burn_r}}公里内形成焦土。地质层受到强烈扰动，触发局部地震，裂缝在地表延伸，公路和铁路扭曲断裂。", "ocean_extra": "", "visual_cue": "浅角火球掠空，蘑菇云低旋", "warning_note": "适用于L3级（E≥1.0e+09吨TNT）冰质天体陆地浅角度斜撞场景，注意低角度导致能量横向扩散，但撞击坑和冲击波破坏范围仍大。"}, {"rule_id": "L3-surface-ice-land-G2", "level": "L3", "impact_type": "surface", "material": "ice", "target": "land", "angle_group": "G2", "e_min": 1000000000.0, "e_max": 1000000000000.0, "disaster_title": "中型灾难", "main_text": "一颗直径约{{diameter}}米的冰彗星以{{velocity}}公里/秒的速度闯入大气层，入射角约{{angle}}度。由于冰质结构疏松，它在高空便开始剧烈烧蚀，大量物质在{{breakup_altitude}}公里处解体，最终仅有{{remain_mass_ratio}}的质量残留并砸向地面。撞击瞬间释放出相当于{{final_tnt}}百万吨TNT的能量，形成强大的冲击波和热辐射。", "angle_desc": "标准倾斜入射，冲击分布均衡，能量沿轨迹呈扇形扩散。", "airburst_only": "", "surface_only": "冰彗星主体穿透大气层后，以高速砸入地表，瞬间凿出一个巨大的撞击坑（直径约{{crater_r}}米），坑缘溅射物抛向天空，冲击波以超音速向外扩散，摧毁范围内的建筑物和植被。", "land_extra": "在数百公里范围内，玻璃窗震碎、建筑结构受损，森林出现大面积倒伏，地面裂缝延伸数公里，局部地区可能触发地震和山体滑坡。", "ocean_extra": "", "visual_cue": "冰蓝火球砸地，溅射冲天", "warning_note": "E介于1.0e9~1.0e12吨TNT，L3级地表撞击，适用于冰质天体中等角度撞击陆地事件。"}, {"rule_id": "L3-surface-ice-land-G3", "level": "L3", "impact_type": "surface", "material": "ice", "target": "land", "angle_group": "G3", "e_min": 1000000000.0, "e_max": 1000000000000.0, "disaster_title": "中型灾难", "main_text": "一颗直径约{{diameter}}米的冰彗星以{{velocity}}公里/秒的速度、{{angle}}度角切入大气层。由于其结构疏松，在穿越大气层时已部分解体，但仍有{{remain_mass_ratio}}的质量残留，最终在{{breakup_altitude}}公里的高空发生猛烈碎裂。残余碎块以近垂直角度高速砸向地面，形成一次中型地表撞击事件。撞击瞬间释放出相当于{{final_tnt}}吨TNT的能量，冲击波和热辐射横扫周围区域。", "angle_desc": "接近垂直入射（60~90°），能量纵向集中，穿透更深，地表破坏更为集中。", "airburst_only": "", "surface_only": "冰彗星残体裹挟着碎裂的冰晶与岩石，以雷霆万钧之势撞击地面。撞击点瞬间形成巨大的撞击坑，坑体直径约{{crater_r}}米，深度惊人。溅射物抛向高空，形成遮天蔽日的尘埃云，冲击波以超音速向外扩散，摧毁范围内的建筑物和森林。", "land_extra": "陆地上，撞击点周围数十公里内建筑倒塌、森林焚毁，强烈的地震波沿地表传播，引发山体滑坡和地面裂缝。热辐射点燃一切可燃物，火海蔓延。", "ocean_extra": "", "visual_cue": "近垂直火球砸地，巨坑与蘑菇云", "warning_note": "适用于E≥10亿吨TNT且<1万亿吨TNT的陆地冰彗星地表撞击事件，陡角度入射，注意撞击坑与地震效应。"}, {"rule_id": "L3-surface-rock-land-G1", "level": "L3", "impact_type": "surface", "material": "rock", "target": "land", "angle_group": "G1", "e_min": 1000000000.0, "e_max": 1000000000000.0, "disaster_title": "中型灾难", "main_text": "一颗直径为{{diameter}}米的岩石陨石以{{velocity}}公里/秒的速度，沿{{angle}}度浅角度斜掠入大气层。由于岩石结构中等，它在高空经历剧烈烧蚀，剩余质量比例仅为{{remain_mass_ratio}}，并在{{breakup_altitude}}公里高度发生显著解体。然而，残余碎片仍以极高动能砸向地面，形成一个巨大的撞击坑，并释放出相当于{{final_tnt}}百万吨TNT的能量。冲击波、热辐射和地震波将席卷周边数百公里，造成中等规模的区域性灾难。", "angle_desc": "浅角度斜掠入射，能量沿横向扩散，纵向集中较弱，导致地面效应分布较广但深度有限。", "airburst_only": "", "surface_only": "残余天体碎片猛烈撞击地面，瞬间凿出一个直径约{{crater_r}}公里的撞击坑，坑缘溅射物抛向数公里高空，强烈的撞击地震波沿地表传播，引发建筑倒塌和地面断裂。", "land_extra": "撞击点周围数十公里内，建筑物将遭受冲击波和飞溅碎片的双重打击，森林可能因热辐射和冲击波引发大面积火灾，同时触发局部地震，破坏基础设施。", "ocean_extra": "", "visual_cue": "低空火球与巨型烟柱腾空", "warning_note": "L3中型灾难，地表撞击，岩石陨石，陆地目标，浅角度入射，适用于百万吨级TNT当量，注意冲击波、地震与火灾的复合效应。"}, {"rule_id": "L3-surface-rock-land-G2", "level": "L3", "impact_type": "surface", "material": "rock", "target": "land", "angle_group": "G2", "e_min": 1000000000.0, "e_max": 1000000000000.0, "disaster_title": "中型灾难", "main_text": "一颗直径约{{diameter}}米的岩石陨石以{{velocity}}公里/秒的速度撞向陆地，入射角约{{angle}}度。在大气层中，它保留了约{{remain_mass_ratio}}的质量，在{{breakup_altitude}}公里高度发生部分解体，但主体仍高速冲向地面。撞击瞬间，地面剧烈震动，尘土与碎石冲天而起。", "angle_desc": "中等倾斜入射，冲击波与碎片分布较为均衡。", "airburst_only": "", "surface_only": "陨石主体撞击地面，形成一个巨大的撞击坑，坑缘隆起，周围岩层被猛烈挤压变形。冲击波以超音速向四周扩散，摧毁方圆数十公里内的建筑物和森林。", "land_extra": "撞击点附近的建筑几乎瞬间被夷为平地，森林燃起大火，强烈的震动引发山体滑坡和地裂缝。", "ocean_extra": "", "visual_cue": "耀眼白光后，黑烟柱腾起", "warning_note": "L3级，岩石陨石地表撞击陆地，中等角度，适用于百万吨级至亿吨级TNT当量事件。"}, {"rule_id": "L3-surface-rock-land-G3", "level": "L3", "impact_type": "surface", "material": "rock", "target": "land", "angle_group": "G3", "e_min": 1000000000.0, "e_max": 1000000000000.0, "disaster_title": "中型灾难", "main_text": "一颗直径约{{diameter}}米的岩石陨石以{{velocity}}公里/秒的速度、约{{angle}}°的陡角度直插大地。在大气层中，它承受着极端摩擦与压力，至{{breakup_altitude}}公里高度时已分裂为多块，但整体仍有{{remain_mass_ratio}}的质量保留，最终以集中而迅猛的方式撞击地面。撞击瞬间，地面剧烈震动，烟尘柱冲天而起，冲击波向外横扫，热辐射引燃大片区域。", "angle_desc": "陡角度（60~90°）近垂直入射，能量纵向集中，穿透更深，地表破坏更集中在撞击点周围。", "airburst_only": "", "surface_only": "撞击坑在轰鸣声中形成，岩层被凿出深坑，碎屑飞溅，坑缘隆起，周围地面开裂。冲击波与地震波叠加，摧毁半径{{blast_core_r}}米内的建筑，{{blast_outer_r}}米外的玻璃震碎，树木连根拔起。", "land_extra": "陆地建筑在冲击波中崩塌，森林燃起大火，地表裂缝延伸数公里，局部地形永久改变。", "ocean_extra": "", "visual_cue": "巨型烟柱腾空，火球映红大地", "warning_note": "E介于十亿吨至万亿吨TNT，L3级别，适用于岩石陨石陆地陡角撞击事件。"}, {"rule_id": "L3-surface-iron-land-G1", "level": "L3", "impact_type": "surface", "material": "iron", "target": "land", "angle_group": "G1", "e_min": 1000000000.0, "e_max": 1000000000000.0, "disaster_title": "中型灾难", "main_text": "一颗直径约{{diameter}}米的铁质陨石以{{velocity}}公里/秒的速度、{{angle}}°的浅角度斜掠入大气层。由于铁陨石致密坚固，抗烧蚀能力极强，在穿越大气层过程中仅损失了{{remain_mass_ratio}}的质量，最终在{{breakup_altitude}}公里高空发生轻微解体，但主体仍然完整，带着巨大的动能猛然砸向地面，形成一个巨大的撞击坑。撞击瞬间释放的能量相当于{{final_tnt}}吨TNT当量，强烈的冲击波和热辐射瞬间席卷周围地区。", "angle_desc": "浅角度斜掠入射，能量横向扩散明显，纵向穿透力相对较弱，但地表破坏范围更广。", "airburst_only": "", "surface_only": "铁陨石的主体以浅角度砸入地面，撞击坑直径达{{crater_r}}米，坑缘溅射物呈放射状抛洒。撞击点周围{{blast_core_r}}米范围内几乎被夷为平地，任何建筑和植被都在冲击波中化为齑粉。", "land_extra": "撞击点附近的城市建筑在冲击波中大面积倒塌，玻璃碎片横飞；森林地带则引发大规模山火，火势迅速蔓延。地面出现剧烈震动，震感堪比{{seismic_magnitude}}级地震，周边地区可感受到明显的摇晃。", "ocean_extra": "", "visual_cue": "铁质火球斜掠天际，蘑菇云升腾", "warning_note": "L3级地表撞击（铁陨石），浅角度入射，适用于撞击陆地场景，当量1e9~1e12吨TNT，注意撞击坑与冲击波描述。"}, {"rule_id": "L3-surface-iron-land-G2", "level": "L3", "impact_type": "surface", "material": "iron", "target": "land", "angle_group": "G2", "e_min": 1000000000.0, "e_max": 1000000000000.0, "disaster_title": "中型灾难", "main_text": "一枚直径约{{diameter}}米的铁质陨石以{{velocity}}公里/秒的速度、{{angle}}度角切入大气层。得益于其致密的铁镍结构，它几乎完整穿透大气，在{{breakup_altitude}}公里高空才开始解体，最终仍有{{remain_mass_ratio}}的质量存活至地表。随着一声撕裂长空的尖啸，它撞击地面，瞬间将动能转化为恐怖的热能与冲击波。", "angle_desc": "陨石以中等倾斜角度（30-60°）切入，能量分布较为均匀，既非水平掠过，也非垂直砸落，对地表造成的破坏呈对称扩展。", "airburst_only": "", "surface_only": "撞击发生的瞬间，地面被砸出一个巨大的撞击坑，坑缘溅射物抛向数公里外，冲击波掀翻方圆{{blast_outer_r}}米内的一切建筑与树木，核心区{{blast_core_r}}米内彻底夷为平地。撞击坑半径约为{{crater_r}}米，深度足以容纳一栋数十层高楼，坑底可见被高温熔化的玻璃化岩层。", "land_extra": "陆地上的城镇在冲击波和热辐射下瞬间化为废墟，森林燃起大火，地面剧烈震动诱发局部地震，震感波及数百公里。冲击波造成的玻璃碎片和飞沙走石造成二次伤害，通讯与交通完全中断。", "ocean_extra": "", "visual_cue": "巨型蘑菇云升腾，火光冲天", "warning_note": "本模板适用于L3级地表撞击事件，铁陨石材质，陆地目标，中等倾角（30-60°）。当量范围约10万吨至1000万吨TNT，可造成区域性毁灭。"}, {"rule_id": "L3-surface-iron-land-G3", "level": "L3", "impact_type": "surface", "material": "iron", "target": "land", "angle_group": "G3", "e_min": 1000000000.0, "e_max": 1000000000000.0, "disaster_title": "中型灾难", "main_text": "一枚主要由铁构成的天体，在穿越大气层时保留了约{{remain_mass_ratio}}的质量，最终在约{{breakup_altitude}}公里的高度发生部分解体。由于铁质结构的坚固性，主体以近垂直的角度猛烈砸向地面，瞬间释放出相当于{{final_tnt}}吨TNT的能量。巨大的冲击力使地面剧烈震颤，形成深达数十米的撞击坑，溅射物如雨点般飞散，冲击波以超音速向外横扫，摧毁方圆数十公里内的所有人工建筑与自然植被。", "angle_desc": "天体以60°至90°的陡角近垂直入射，能量高度纵向集中，穿透力极强，撞击坑深度与破坏范围均显著增大。", "airburst_only": "", "surface_only": "在接触地面的刹那，铁质天体以极高速度凿入地表，瞬间挖掘出一个巨大的撞击坑，坑缘翘起，坑底破碎，强烈的冲击波与热辐射将周围环境化为焦土。", "land_extra": "撞击点周围半径{{blast_core_r}}公里内的建筑物几乎完全倒塌，森林被连根拔起并引发大面积火灾；强烈的地震波沿地壳传播，可能触发山体滑坡与地面裂缝，远至{{blast_outer_r}}公里外的城镇仍能感受到明显的震感。", "ocean_extra": "", "visual_cue": "蘑菇云冲天，地表巨坑", "warning_note": "适用于1亿吨至1千亿吨TNT当量、铁质天体撞击陆地的中型灾难事件，强调近垂直入射导致的深穿透与高集中破坏。"}, {"rule_id": "L4-airburst-ice-land-G1", "level": "L4", "impact_type": "airburst", "material": "ice", "target": "land", "angle_group": "G1", "e_min": 1000000000000.0, "e_max": 1000000000000000.0, "disaster_title": "大型灾变", "main_text": "一颗直径约{{diameter}}米的冰彗星以{{velocity}}公里/秒的速度斜掠入大气层，入射角仅{{angle}}度。其疏松结构在高层大气中迅速碎裂，剩余质量仅{{remain_mass_ratio}}，在{{breakup_altitude}}公里高度发生剧烈空爆，释放出相当于{{final_tnt}}吨TNT的能量。", "angle_desc": "浅角度斜掠大气层，能量沿水平方向扩散，纵向冲击较弱，但火球轨迹绵延数百公里。", "airburst_only": "冰体在高层大气中完全解体，没有碎片抵达地面。空中形成直径约{{fireball_r}}公里的耀眼火球，伴随强烈热辐射，可致下方森林大面积燃烧。冲击波在{{blast_core_r}}公里半径内摧毁建筑，在{{blast_outer_r}}公里外仍可震碎玻璃。", "surface_only": "", "land_extra": "陆地上空发生高空爆炸，虽然地面无空中冲击波，但冲击波和热辐射对城市与生态造成毁灭性打击。森林起火范围可达{{burn_r}}公里，地面建筑在核心区被夷为平地，并可能引发局部地震。", "ocean_extra": "", "visual_cue": "横贯天际的炽白火球，尾部碎冰如雨", "warning_note": "适用于L4级别浅角度空爆事件，E在1.0e+12~1.0e+15吨TNT之间，冰彗星成分，陆地目标，无海啸影响。"}, {"rule_id": "L4-airburst-ice-land-G2", "level": "L4", "impact_type": "airburst", "material": "ice", "target": "land", "angle_group": "G2", "e_min": 1000000000000.0, "e_max": 1000000000000000.0, "disaster_title": "大型灾变", "main_text": "一颗直径约{{diameter}}米的冰彗星以{{velocity}}公里/秒的速度进入大气层，入射角约{{angle}}度。冰质结构使其在高层大气中迅速升温，于{{breakup_altitude}}公里高度发生剧烈解体，剩余质量仅占初始质量的{{remain_mass_ratio}}。解体产生的碎片云在天空形成耀眼火球，释放出相当于{{final_tnt}}吨TNT的能量，巨大的冲击波和热辐射横扫下方陆地。", "angle_desc": "中等倾斜角度（30°~60°）使冲击波以标准扇形扩散，能量分布相对均衡，对地面形成广域影响。", "airburst_only": "在高空爆炸中，冰彗星完全解体，没有固体残骸触及地面。火球直径达{{fireball_r}}公里，热辐射可点燃{{burn_r}}公里范围内的植被，冲击波核心半径{{blast_core_r}}公里内建筑将遭受毁灭性破坏，但不会形成空中冲击。", "surface_only": "", "land_extra": "陆地上，强烈的冲击波可能引发大面积森林火灾和建筑倒塌，地面震动感明显，但无爆炸球壳形成。", "ocean_extra": "", "visual_cue": "巨型火球撕裂云层，天空苍白闪光", "warning_note": "E在10^12~10^15吨TNT区间，L4级空爆事件，适用于冰彗星陆地高空解体，注意热辐射与冲击波范围。"}, {"rule_id": "L4-airburst-ice-land-G3", "level": "L4", "impact_type": "airburst", "material": "ice", "target": "land", "angle_group": "G3", "e_min": 1000000000000.0, "e_max": 1000000000000000.0, "disaster_title": "大型灾变", "main_text": "一颗直径约{{diameter}}公里的冰彗星以{{velocity}}公里/秒的速度冲入地球大气层，入射角接近垂直（{{angle}}°）。由于冰质结构疏松，它在约{{breakup_altitude}}公里的高空开始剧烈解体，剩余质量仅占原质量的{{remain_mass_ratio}}。剧烈的摩擦加热引发连锁气化，释放出相当于{{final_tnt}}吨TNT的能量，形成一个直径达{{fireball_r}}公里的灼热火球，将天空染成橙红色。", "angle_desc": "近垂直入射，能量纵向集中，高空爆破碎片垂直下落，冲击波向下传播强烈。", "airburst_only": "冰彗星在高层大气中完全解体，形成一个巨大的火球，但并未触及地面。冲击波以超音速向四周扩散，地面感受到强烈的气压脉动，但未形成任何空中冲击。热辐射瞬间烧毁大片区域，引发大面积火灾。", "surface_only": "", "land_extra": "陆地上，冲击波摧毁了方圆{{blast_core_r}}公里内的建筑物，{{blast_outer_r}}公里范围内的玻璃窗破碎。森林区域发生大面积燃烧，{{burn_r}}公里内的植被化为灰烬。地面剧烈震动，相当于一场大地震，但并未形成空中冲击。", "ocean_extra": "", "visual_cue": "橙红火球笼罩天空，冲击波环扩散", "warning_note": "适用于L4级空中解体事件，冰质彗星，陆地目标，能量范围1.0e+12~1.0e+15吨TNT。"}, {"rule_id": "L4-airburst-rock-land-G1", "level": "L4", "impact_type": "airburst", "material": "rock", "target": "land", "angle_group": "G1", "e_min": 1000000000000.0, "e_max": 1000000000000000.0, "disaster_title": "大型灾变", "main_text": "一颗直径约{{diameter}}公里的岩石陨石以浅角度斜掠大气层，速度高达{{velocity}}公里/秒。由于入射角极小，它在高层大气中摩擦减速，大量物质在{{breakup_altitude}}公里的高空剧烈烧蚀解体，最终仅有{{remain_mass_ratio}}的质量残存。爆炸释放的能量相当于{{final_tnt}}百万吨TNT，形成一个直径{{fireball_r}}公里的巨型火球，冲击波和热辐射横扫数百公里。", "angle_desc": "浅角度斜掠大气层，能量横向扩散，纵向冲击减弱，但高空效应显著。", "airburst_only": "陨石在距地面数十公里处发生凌空爆炸，巨大的火球照亮天空，冲击波以球形向外扩散，引发大面积树木倒伏和建筑玻璃破碎，但未形成地表空中冲击。", "surface_only": "", "land_extra": "地面城市遭遇强风与热浪袭击，森林大火蔓延，建筑物外墙剥落，通讯中断，地面出现剧烈震动但无爆炸球壳形成。", "ocean_extra": "", "visual_cue": "天空闪耀巨型火球，冲击波环形扩散", "warning_note": "适用于L4级岩石陨石陆地空爆事件，TNT当量1e12~1e15吨，浅角度入射。"}, {"rule_id": "L4-airburst-rock-land-G2", "level": "L4", "impact_type": "airburst", "material": "rock", "target": "land", "angle_group": "G2", "e_min": 1000000000000.0, "e_max": 1000000000000000.0, "disaster_title": "大型灾变", "main_text": "一颗直径约{{diameter}}米的岩石陨石以{{velocity}}公里/秒的速度、{{angle}}°的标准倾斜角度冲入大气层。由于岩石结构中等，大气摩擦使其部分解体，最终仅有{{remain_mass_ratio}}的质量幸存，并在{{breakup_altitude}}公里的高空发生剧烈空爆。爆炸释放出相当于{{final_tnt}}亿吨TNT的能量，形成一个直径达{{fireball_r}}公里的火球，冲击波和热辐射瞬间席卷方圆{{blast_core_r}}公里。", "angle_desc": "标准倾斜入射，冲击分布均衡。", "airburst_only": "空爆发生在空中，没有形成空中冲击。巨大的火球在天空闪耀，冲击波以爆心为中心向外扩散，热辐射将地表物体点燃，但没有任何地面高空火球作用区产生。", "surface_only": "", "land_extra": "陆地上，爆炸冲击波摧毁了半径{{blast_outer_r}}公里内的建筑和森林，引发大面积火灾。地面震动感明显，但并未形成空中冲击。", "ocean_extra": "", "visual_cue": "巨大火球照亮天空，冲击波横扫", "warning_note": "E在1.0e+12~1.0e+15吨TNT之间，L4级别空爆事件，适用于大型空中解体场景。"}, {"rule_id": "L4-airburst-rock-land-G3", "level": "L4", "impact_type": "airburst", "material": "rock", "target": "land", "angle_group": "G3", "e_min": 1000000000000.0, "e_max": 1000000000000000.0, "disaster_title": "大型灾变", "main_text": "一块直径约{{diameter}}米的岩石陨石以接近垂直的角度（入射角约{{angle}}°）高速冲入大气层，速度达{{velocity}}公里/秒。由于岩石结构中等，在穿越大气层时剧烈摩擦，在约{{breakup_altitude}}公里的高空发生猛烈解体，剩余质量仅为初始的{{remain_mass_ratio}}。巨大的动能瞬间转化为热能和冲击波，形成一个直径{{fireball_r}}公里的炽热火球，亮度远超太阳，方圆数百公里内可见。随后，强大的冲击波以超音速向外扩散，核心区域（半径{{blast_core_r}}公里）内一切建筑物被夷为平地，外围区域（半径{{blast_outer_r}}公里）也遭受严重破坏。热辐射引发大面积火灾，燃烧半径达{{burn_r}}公里。由于是空中解体，没有形成空中冲击波，但地表仍受到强烈的冲击和热浪洗礼。", "angle_desc": "近垂直入射，能量纵向集中，穿透深度大，大气层路径较短，能量释放更集中。", "airburst_only": "陨石在空中完全解体，没有残骸触及地面，因此未产生任何空中冲击。爆炸发生在高层大气，冲击波和热辐射是主要破坏方式，地面仅受到波及，无直接撞击痕迹。", "surface_only": "", "land_extra": "陆地目标遭受毁灭性打击：核心区域内的城市建筑瞬间倒塌，森林被点燃，引发大面积山火，地面出现强烈震动，类似地震，但无高空解体冲击波扩散。", "ocean_extra": "", "visual_cue": "巨型火球照亮天空，冲击波扩散", "warning_note": "L4级别，能量范围1.0e+12~1.0e+15吨TNT，适用于大型空中解体事件，注意与地表撞击区分。"}, {"rule_id": "L4-airburst-iron-land-G1", "level": "L4", "impact_type": "airburst", "material": "iron", "target": "land", "angle_group": "G1", "e_min": 1000000000000.0, "e_max": 1000000000000000.0, "disaster_title": "大型灾变", "main_text": "一枚直径约{{diameter}}公里的铁质小行星以{{velocity}}公里/秒的速度斜掠进入大气层，入射角约{{angle}}度。由于其致密的铁质结构，它并未像冰质或岩石天体那样迅速解体，但浅角度的长距离穿越仍然让它在约{{breakup_altitude}}公里的高空发生剧烈爆裂。残余质量仅剩{{remain_mass_ratio}}，大部分物质在飞行中烧蚀殆尽，但剩余部分在高层大气中瞬间释放出相当于{{final_tnt}}吨TNT的能量。", "angle_desc": "浅角度斜掠入射，能量沿飞行轨迹横向扩散，纵向冲击较弱，但热辐射和冲击波覆盖范围极广。", "airburst_only": "空中爆裂形成了一个巨大的火球，其核心半径约{{fireball_r}}公里，灼热的光球笼罩天空，冲击波以超音速向四周扩散，核心破坏半径{{blast_core_r}}公里，外围破坏半径{{blast_outer_r}}公里。热辐射点燃了下方广袤区域，燃烧半径达{{burn_r}}公里，但地面未形成任何空中冲击。", "surface_only": "", "land_extra": "在陆地上空，冲击波重创城市建筑，玻璃幕墙粉碎，树木成片倒伏，地面发生强烈震动，但无高空解体冲击波扩散。爆炸引发多处森林火灾，浓烟滚滚，通讯系统中断，大量基础设施受损。", "ocean_extra": "", "visual_cue": "斜掠天火横扫大地", "warning_note": "E≥1e12吨TNT，L4级别，适用于铁质天体高空空爆事件，浅角度入射，注意能量横向扩散，禁止描述火球冲击区体。"}, {"rule_id": "L4-airburst-iron-land-G2", "level": "L4", "impact_type": "airburst", "material": "iron", "target": "land", "angle_group": "G2", "e_min": 1000000000000.0, "e_max": 1000000000000000.0, "disaster_title": "大型灾变", "main_text": "一颗直径约{{diameter}}米的铁质小行星以{{velocity}}公里/秒的速度斜插入大气层，入射角约{{angle}}度。尽管铁陨石结构致密，但在巨型能量的作用下，它在高空{{breakup_altitude}}公里处发生剧烈解体，剩余质量仅为初始的{{remain_mass_ratio}}。爆炸瞬间释放出相当于{{final_tnt}}亿吨TNT的能量，形成一个直径{{fireball_r}}公里的灼热火球，其亮度超过太阳，数百公里外肉眼可见。", "angle_desc": "标准倾斜入射，冲击分布均衡，能量在大气层中传播较为均匀。", "airburst_only": "铁陨石在高空完全解体，未接低空爆炸表，无高空解体冲击波扩散。爆炸产生强烈的冲击波和热辐射，地面建筑物玻璃尽碎，树木向四周倒伏，但地表未留下任何爆炸球壳痕迹。", "surface_only": "", "land_extra": "陆地范围内，冲击波导致建筑物倒塌、森林大面积焚毁，并可能引发强烈地震，震感波及数十公里。", "ocean_extra": "", "visual_cue": "巨型火球笼罩天空，云层被撕裂", "warning_note": "L4级别空爆事件，适用于铁陨石高空解体场景，能量范围1万亿至1000万亿吨TNT，注意区分地表撞击。"}, {"rule_id": "L4-airburst-iron-land-G3", "level": "L4", "impact_type": "airburst", "material": "iron", "target": "land", "angle_group": "G3", "e_min": 1000000000000.0, "e_max": 1000000000000000.0, "disaster_title": "大型灾变", "main_text": "一枚直径约{{diameter}}米的铁质小行星以近垂直角度切入大气层，速度高达{{velocity}}公里/秒。由于铁质结构致密，它抗烧蚀能力极强，但极端的速度和角度仍使其在高层大气中发生剧烈解体。最终，约{{remain_mass_ratio}}的质量残骸在{{breakup_altitude}}公里的高空发生猛烈爆炸，释放出相当于{{final_tnt}}吨TNT的能量。爆炸瞬间，天空被一个直径约{{fireball_r}}公里的白炽火球照亮，强烈的热辐射在{{burn_r}}公里范围内引发大面积火灾。", "angle_desc": "近垂直入射，能量纵向集中，冲击波向下传播效率极高。", "airburst_only": "爆炸发生在地面上空，没有形成空中冲击。火球迅速膨胀，产生超压冲击波，以爆心投影点为中心向外横扫，在{{blast_core_r}}公里核心区域内建筑尽毁，{{blast_outer_r}}公里范围内玻璃破碎、树木折断。巨大的蘑菇云升腾至平流层，尘埃和碎屑随高空风扩散，形成区域性气候异常。", "surface_only": "", "land_extra": "陆地表面遭遇严重的热辐射和冲击波破坏，森林大面积燃烧，城市基础设施瘫痪，地面出现裂缝和变形，但没有形成空中冲击。", "ocean_extra": "", "visual_cue": "白炽火球瞬间照亮大地，蘑菇云冲天而起", "warning_note": "适用于E≥10^12吨TNT，L4级别，铁陨石近垂直空爆事件；注意避免与地表撞击混淆。"}, {"rule_id": "L4-surface-ice-land-G1", "level": "L4", "impact_type": "surface", "material": "ice", "target": "land", "angle_group": "G1", "e_min": 1000000000000.0, "e_max": 1000000000000000.0, "disaster_title": "大型灾变", "main_text": "一颗直径约{{diameter}}公里的冰彗星以{{velocity}}公里/秒的速度斜掠入大气层，入射角仅{{angle}}度。由于冰质结构疏松，它在高层大气中就开始剧烈烧蚀，{{breakup_altitude}}公里高空发生第一次解体，碎块云绵延数百公里。最终约{{remain_mass_ratio}}的残余质量砸向地面，形成一场毁灭性的地表撞击。", "angle_desc": "浅角度斜掠入射，能量沿水平方向大幅扩散，纵向冲击深度有限，但地表破坏范围极为广阔。", "airburst_only": "", "surface_only": "冰彗星残骸以低角度砸向地面，接触瞬间释放出惊人的能量，在着陆点形成一个巨大的撞击坑。冲击波与热辐射以横扫之势席卷周围数万平方公里，所到之处一切皆被夷平。", "land_extra": "在陆地上，撞击坑边缘溅射出高温碎屑，引发大面积森林火灾；强烈的地震波沿地壳传播，导致建筑物倒塌、地面开裂，数公里外的城市瞬间沦为废墟。", "ocean_extra": "", "visual_cue": "低角度火球横扫地平线，撞击扬尘遮天蔽日", "warning_note": "适用于L4级（1.0e12~1.0e15吨TNT）冰质天体低角度撞击陆地事件，注意浅角入射导致的地表破坏范围扩大。"}, {"rule_id": "L4-surface-ice-land-G2", "level": "L4", "impact_type": "surface", "material": "ice", "target": "land", "angle_group": "G2", "e_min": 1000000000000.0, "e_max": 1000000000000000.0, "disaster_title": "大型灾变", "main_text": "一颗直径约{{diameter}}米的冰彗星以{{velocity}}公里/秒的速度撞向陆地，入射角约{{angle}}度。尽管冰质结构疏松，在穿越大气层时已部分解体，但仍有约{{remain_mass_ratio}}的质量残留，并在{{breakup_altitude}}公里高度发生剧烈碎裂。巨大的火球瞬间照亮大地，随即引发毁灭性的地面撞击。", "angle_desc": "标准倾斜入射，冲击分布均衡，能量传递较为均匀。", "airburst_only": "", "surface_only": "撞击瞬间，地面被砸出一个巨大的撞击坑，坑体直径约{{crater_r}}米，溅射物抛向高空，冲击波以超音速向外扩散，形成半径{{blast_core_r}}米的完全摧毁区。", "land_extra": "冲击波横扫城市，建筑物在数秒内崩塌，森林被连根拔起，地表出现强烈震动，引发区域性地震和火灾。", "ocean_extra": "", "visual_cue": "冰晶火球撞击地面，溅射冲天", "warning_note": "E≥1.0e+12吨TNT，L4级别，适用于冰质天体陆地地表撞击事件，可能引发区域级毁灭。"}, {"rule_id": "L4-surface-ice-land-G3", "level": "L4", "impact_type": "surface", "material": "ice", "target": "land", "angle_group": "G3", "e_min": 1000000000000.0, "e_max": 1000000000000000.0, "disaster_title": "大型灾变", "main_text": "一颗直径约{{diameter}}公里的冰彗星以{{velocity}}公里/秒的速度，以{{angle}}°的角度近乎垂直地砸向陆地。由于冰质结构疏松，它在穿越大气层时已损失了相当一部分质量，最终仅剩{{remain_mass_ratio}}的质量抵达地面。在{{breakup_altitude}}公里的高度，它的主体开始剧烈解体，但残余的核心仍携带着巨大的动能，直冲地表。撞击瞬间，大地剧烈震颤，一个巨大的撞击坑瞬间形成，冲击波以超音速向四周扩散，将方圆数十公里内的城市夷为平地，引发大规模地震和山体滑坡。", "angle_desc": "接近垂直的入射角度，使能量高度集中，穿透力极强，对地壳的破坏深度远超同等级其他角度。", "airburst_only": "", "surface_only": "撞击坑在陆地上骤然炸开，地面被凿出一个直径约{{crater_r}}公里的巨坑，溅射物抛向高空，形成遮天蔽日的尘埃云。", "land_extra": "撞击点周围的建筑物瞬间被冲击波摧毁，森林燃起大火，地表裂缝延伸数百公里，地震强度达到9级以上，多个城市被彻底抹去。", "ocean_extra": "", "visual_cue": "巨大火球腾空，蘑菇云直冲天际", "warning_note": "适用于L4级大型灾变，冰质彗星以陡角撞击陆地，能量集中在1.0e12至1.0e15吨TNT当量区间。"}, {"rule_id": "L4-surface-rock-land-G1", "level": "L4", "impact_type": "surface", "material": "rock", "target": "land", "angle_group": "G1", "e_min": 1000000000000.0, "e_max": 1000000000000000.0, "disaster_title": "大型灾变", "main_text": "陨石以低角度斜掠大气层，因岩石材质中等致密，虽部分烧蚀但仍有{{remain_mass_ratio}}的质量存留，在{{breakup_altitude}}千米高度发生剧烈解体，碎片裹挟着高温与动能，最终砸入地面。", "angle_desc": "浅角度（5°-30°）斜掠入射，能量横向扩散显著，纵向集中较弱，冲击波与热辐射分布不均，但波及范围更广。", "airburst_only": "", "surface_only": "撞击瞬间，巨大的冲击坑在陆地上炸裂开来，岩层碎屑冲天而起，形成环形山。冲击波以超音速横扫四周，摧毁方圆数十公里内的一切建筑物，森林被连根拔起，地面剧烈震动，引发大规模地震。", "land_extra": "陆地目标遭受毁灭性打击：城市夷为平地，基础设施完全瘫痪，大火蔓延，大量人员伤亡。地震波传播数百公里，触发山体滑坡与地面裂缝。", "ocean_extra": "", "visual_cue": "陨石斜掠，火球拖尾，尘土巨浪", "warning_note": "适用于E≥1e12且<1e15吨TNT的浅角度地表撞击事件，岩石材质陆地目标，注意冲击波与地震灾害。"}, {"rule_id": "L4-surface-rock-land-G2", "level": "L4", "impact_type": "surface", "material": "rock", "target": "land", "angle_group": "G2", "e_min": 1000000000000.0, "e_max": 1000000000000000.0, "disaster_title": "大型灾变", "main_text": "一颗直径约{{diameter}}米的岩石陨石以{{velocity}}公里/秒的速度撞向地面，入射角约{{angle}}度。在穿越大气层时，其质量仅剩{{remain_mass_ratio}}，并在约{{breakup_altitude}}公里高度发生剧烈解体。陨石主体撕裂大气，形成炫目的火球，随即轰然撞击地面，扬起遮天蔽日的尘埃。", "angle_desc": "中等角度倾斜入射，冲击波分布较为均衡，地表破坏范围呈对称扩展。", "airburst_only": "", "surface_only": "陨石以中等角度砸入地面，瞬间形成一个巨大的撞击坑，坑缘高高隆起，碎裂的岩块抛射至数十公里外。撞击点周围的地表被强烈压缩，形成深达数十米的坑体，冲击波以超音速向四周扩散。", "land_extra": "撞击引发强烈地震，震感波及数百公里，附近城市建筑大面积倒塌，森林瞬间被冲击波夷平，并引发多处山火。", "ocean_extra": "", "visual_cue": "巨型蘑菇云腾空而起，地面剧烈震动", "warning_note": "适用于L4级岩石陨石陆地地表撞击，TNT当量在1万亿至1000万亿吨之间，能量巨大，破坏范围可达数千公里。"}, {"rule_id": "L4-surface-rock-land-G3", "level": "L4", "impact_type": "surface", "material": "rock", "target": "land", "angle_group": "G3", "e_min": 1000000000000.0, "e_max": 1000000000000000.0, "disaster_title": "大型灾变", "main_text": "一颗直径约{{diameter}}米的岩石陨石以{{velocity}}公里/秒的速度，呈接近垂直的角度（{{angle}}°）砸向地面。在穿越大气层时，由于结构中等，它并未完全解体，最终仍有{{remain_mass_ratio}}的质量残留，并在约{{breakup_altitude}}公里的高度发生部分破碎。陨石主体猛烈撞击地面，瞬间释放出相当于{{final_tnt}}百万吨TNT的能量，形成巨大灾难。", "angle_desc": "接近垂直入射，能量纵向集中，穿透更深，冲击波与地震效应显著增强。", "airburst_only": "", "surface_only": "陨石以陡峭角度直接撞击地面，形成一个巨大的撞击坑，坑体直径可达{{crater_r}}公里，边缘溅射物飞溅数公里。撞击瞬间地表岩层被猛烈挤压，形成强烈地震，震感波及数百公里。", "land_extra": "陆地上，撞击点周围数十公里内的建筑、森林和基础设施被冲击波彻底摧毁，引发大面积火灾。剧烈的震动导致地表裂缝、山体滑坡，并可能触发次生灾害。", "ocean_extra": "", "visual_cue": "巨型蘑菇云升腾，坑中火光冲天", "warning_note": "适用于E≥1.0e+12吨TNT的岩石陨石地表撞击陆地事件，G3陡角入射，能量集中，破坏力极强。"}, {"rule_id": "L4-surface-iron-land-G1", "level": "L4", "impact_type": "surface", "material": "iron", "target": "land", "angle_group": "G1", "e_min": 1000000000000.0, "e_max": 1000000000000000.0, "disaster_title": "大型灾变", "main_text": "一颗直径约{{diameter}}公里的铁质小行星以{{velocity}}公里/秒的速度斜掠入大气层，入射角约{{angle}}度。它并未在高层完全解体，最终仍有{{remain_mass_ratio}}的质量残留，在{{breakup_altitude}}公里的高度突破稠密大气，拖着炽热的尾迹砸向陆地。接触地面的瞬间，释放的能量相当于{{final_tnt}}吨TNT，冲击波瞬间摧毁地表的一切。", "angle_desc": "G1浅角度入射，天体以5~30度的极小倾角斜掠大气层，能量沿水平方向剧烈扩散，纵向破坏相对分散。", "airburst_only": "", "surface_only": "铁质天体以浅角度高速切入地面，形成巨大的撞击坑，坑体直径达{{crater_r}}公里，溅射物抛向数十公里外。由于是铁陨石，结构致密，撞击坑深度和挤压效应显著，岩层被猛烈凿开。", "land_extra": "陆地目标遭受毁灭性打击：方圆{{blast_core_r}}公里内建筑完全夷平，森林燃起大火，火球热辐射引燃{{burn_r}}公里内的植被，强烈地震波沿地壳传播，造成大面积地面裂缝和山体滑坡。", "ocean_extra": "", "visual_cue": "低空火球横扫大地，蘑菇云腾起", "warning_note": "E在1.0e+12~1.0e+15吨TNT之间，L4大型灾变，适用于铁质陨石浅角度陆地撞击事件。"}, {"rule_id": "L4-surface-iron-land-G2", "level": "L4", "impact_type": "surface", "material": "iron", "target": "land", "angle_group": "G2", "e_min": 1000000000000.0, "e_max": 1000000000000000.0, "disaster_title": "大型灾变", "main_text": "一枚直径约{{diameter}}公里的铁质陨石以{{velocity}}公里/秒的速度划破天际，入射角约{{angle}}度。其致密的结构在穿越大气层时仅损失了{{remain_mass_ratio}}的质量，最终在{{breakup_altitude}}公里的高空才发生部分解体。但主体依然保持着惊人的完整性，裹挟着毁灭性的动能冲向地表。接触地面的瞬间，相当于{{final_tnt}}亿吨TNT的能量猛烈释放，引发了一场撼动大陆板块的超级撞击事件。", "angle_desc": "陨石以中等倾斜角度（30~60°）切入大气层，冲击能量在水平与垂直方向上的分布较为均衡，既产生了广泛的抛射物，又形成了深达数公里的撞击坑。", "airburst_only": "", "surface_only": "铁陨石以雷霆万钧之势砸入地面，瞬间在地表凿出一个直径约{{crater_r}}公里、深不见底的巨大撞击坑。坑缘物质被炸飞至数十公里外，激起遮天蔽日的尘埃云，冲击波以超音速向四周扩散，摧毁半径{{blast_outer_r}}公里内的一切人造与自然结构。", "land_extra": "撞击点周围数百公里内的城市建筑如纸牌般倒塌，森林被连根拔起并瞬间碳化，地表破裂形成绵延数十公里的断层裂缝，触发里氏10级以上的强烈地震。冲击波引发的次生火灾四处蔓延，浓烟滚滚，遮蔽天空。", "ocean_extra": "", "visual_cue": "火柱冲天，蘑菇云升腾", "warning_note": "L4级地表撞击（铁陨石、陆地目标、G2中等角度），适用于1万亿至1000万亿吨TNT当量区间的重大陆地撞击事件，可能引发全球性气候异常。"}, {"rule_id": "L4-surface-iron-land-G3", "level": "L4", "impact_type": "surface", "material": "iron", "target": "land", "angle_group": "G3", "e_min": 1000000000000.0, "e_max": 1000000000000000.0, "disaster_title": "大型灾变", "main_text": "一颗直径约{{diameter}}公里的铁质小行星以{{velocity}}公里/秒的速度划破天际，入射角约{{angle}}度，近乎垂直地砸向地面。由于铁陨石极其致密坚固，它在穿越大气层时仅损失了{{remain_mass_ratio}}的质量，直到{{breakup_altitude}}公里的高空才发生有限的解体。剩余的巨大天体携带着相当于{{final_tnt}}亿吨TNT的能量，以雷霆万钧之势重重撞击地面，瞬间在地表凿出一个直径达{{crater_r}}公里的巨大撞击坑。撞击产生的火球半径达{{fireball_r}}公里，核心冲击波半径{{blast_core_r}}公里，热辐射范围扩展至{{burn_r}}公里，地表如同被太阳灼烧。", "angle_desc": "近垂直的超陡角度入射，使得能量纵向集中，穿透力极强，冲击波和热辐射在垂直方向上的破坏效应被放大，深部地层遭受剧烈扰动。", "airburst_only": "", "surface_only": "撞击发生的一刹那，地面被砸出一个巨大的碗状撞击坑，坑缘高高隆起，大量岩石碎块和尘埃被抛向空中，形成遮天蔽日的尘幕。撞击坑深处的地层被剧烈挤压，形成角砾岩和冲击变质矿物，坑底岩石发生熔融，形成玻璃质熔壳。", "land_extra": "强烈的震动波以撞击点为中心向外扩散，方圆数千公里内的建筑物在冲击波和地震的双重作用下倒塌，地面出现大规模断层和裂隙。森林被瞬间点燃，引发大面积火灾，浓烟滚滚。", "ocean_extra": "", "visual_cue": "通天火柱升腾，大地撕裂", "warning_note": "适用于铁质小行星以陡角度（60-90°）撞击陆地的事件，能量范围约1万亿至1000万亿吨TNT，可引发全球性灾难，但不足以导致灭绝。"}, {"rule_id": "L5-airburst-ice-land-null", "level": "L5", "impact_type": "airburst", "material": "ice", "target": "land", "angle_group": null, "e_min": 1000000000000000.0, "e_max": 9e+18, "disaster_title": "灭绝级撞击", "main_text": "一颗直径约{{diameter}}公里的冰彗星以{{velocity}}公里/秒的速度闯入地球大气层，入射角约{{angle}}度。由于冰质结构疏松，它在极高海拔处便开始剧烈烧蚀，在{{breakup_altitude}}公里的高空发生大规模解体。解体时释放出相当于{{final_tnt}}亿吨TNT的能量，但大部分质量（{{remain_mass_ratio}}）在穿越大气层时被消耗殆尽，最终未能触及地面。", "angle_desc": "由于该级别撞击能量极高，入射角度对整体效应的影响相对次要，但无论何种角度，大气层都会成为主要的能量耗散层。", "airburst_only": "天空被撕裂成一片炽白的火海，数十个巨型火球在高空接连爆燃，冲击波以超音速横扫大气层，将下方数百公里的云层瞬间蒸发。热辐射将地表植被点燃，广袤森林在数分钟内化为灰烬，但地面并未形成任何空中冲击波，只有灼热的碎屑云缓缓沉降。", "surface_only": "", "land_extra": "陆地上，强烈的冲击波摧毁了所有建筑，大地在震颤中开裂，引发大规模山体滑坡和地震，但这一切都源于高空爆轰的间接效应，而非直接的撞击作用。", "ocean_extra": "", "visual_cue": "天空裂成白昼，火球连环爆", "warning_note": "L5级空爆事件，适用于冰彗星在大气层中完全解体、不形成解体碎块云的极端场景。能量极高，但地面效应以热辐射和冲击波为主。"}, {"rule_id": "L5-airburst-rock-land-null", "level": "L5", "impact_type": "airburst", "material": "rock", "target": "land", "angle_group": null, "e_min": 1000000000000000.0, "e_max": 9e+18, "disaster_title": "灭绝级撞击", "main_text": "一颗直径达{{diameter}}公里的岩石小行星以{{velocity}}公里/秒的速度冲入大气层，入射角为{{angle}}度。在{{breakup_altitude}}公里的高空，巨大的应力使天体剧烈解体，仅有{{remain_mass_ratio}}的质量幸存。解体产生的碎片云和冲击波横扫大气层，释放出相当于{{final_tnt}}吨TNT的能量。", "angle_desc": "本次撞击事件未具体区分入射角度，整体能量释放以高空爆轰为主，方向性较弱。", "airburst_only": "在高空，岩石天体发生剧烈爆炸，形成一个直径超过{{fireball_r}}公里的火球，其热辐射瞬间点燃地表植被并引发大面积火灾。冲击波以超音速向外扩散，摧毁半径{{blast_core_r}}公里内的一切建筑，其威力波及至{{blast_outer_r}}公里外。强大的热脉冲使方圆{{burn_r}}公里内的物质碳化，但未形成空中冲击。", "surface_only": "", "land_extra": "陆地表面遭遇前所未有的热浪和冲击波，森林成片焚毁，城市化为废墟，地面裂缝纵横，并伴随强烈地震和火山活动。", "ocean_extra": "", "visual_cue": "天空被炽白光球笼罩，冲击波如巨幕扩散", "warning_note": "L5级别，能量≥1e15吨TNT，适用于近地小行星高空解体事件，注意与地表撞击区分。"}, {"rule_id": "L5-airburst-iron-land-null", "level": "L5", "impact_type": "airburst", "material": "iron", "target": "land", "angle_group": null, "e_min": 1000000000000000.0, "e_max": 9e+18, "disaster_title": "灭绝级撞击", "main_text": "一颗直径约{{diameter}}公里的铁质小行星以{{velocity}}公里/秒的速度切入大气层，入射角约{{angle}}度。由于铁质天体异常致密，尽管其结构坚固，但在巨大的动压和热应力下，仍于{{breakup_altitude}}公里高空发生猛烈解体。最终仅有{{remain_mass_ratio}}的质量碎片穿透至低空，绝大部分能量在空中释放。", "angle_desc": "无特定入射角约束，通用描述：该天体以随机角度进入大气，能量释放格局受高空风场与解体模式影响。", "airburst_only": "在高空，铁质碎片云形成多个炽热的火球，持续数分钟，其辐射热足以点燃地表数百公里范围内的可燃物。冲击波以超音速向外扩散，所到之处建筑物被整体掀飞，森林化为灰烬，但并未形成空中冲击。", "surface_only": "", "land_extra": "陆地上，数百公里内的城市被冲击波夷为平地，地面被高温玻璃化，但无深坑形成。强烈的地震波沿地表传播，引发山体滑坡与地面裂缝。", "ocean_extra": "", "visual_cue": "天空连续闪光，多个火球横贯天际，随后冲击波环形扩散", "warning_note": "E≥1e15吨TNT，L5级，适用于铁质天体高空解体事件；注意避免与地表撞击混淆。"}, {"rule_id": "L5-surface-ice-land-null", "level": "L5", "impact_type": "surface", "material": "ice", "target": "land", "angle_group": null, "e_min": 1000000000000000.0, "e_max": 9e+18, "disaster_title": "灭绝级撞击", "main_text": "一颗直径达{{diameter}}公里的冰彗星以{{velocity}}公里/秒的速度撞向陆地，入射角{{angle}}度。尽管冰质结构疏松，但在如此巨大的尺度下，仅有{{remain_mass_ratio}}的质量在大气中烧蚀解体，剩余核心在{{breakup_altitude}}公里高度突破大气层，直接撞击地面。撞击瞬间，释放的能量相当于{{final_tnt}}吨TNT，引发全球性灾难。", "angle_desc": "由于撞击能量极高，角度影响被巨大能量淹没，冲击波和热辐射向全球扩散。", "airburst_only": "", "surface_only": "冰彗星核心以极高速度砸入地面，形成直径{{crater_r}}公里的巨大撞击坑，溅射物抛向平流层，引发全球性尘埃云，遮蔽阳光数月至数年。", "land_extra": "撞击点周围数千公里内的建筑、森林瞬间被摧毁，冲击波引发强烈地震，地壳破裂，火山活动加剧，全球生态系统崩溃。", "ocean_extra": "", "visual_cue": "白炽光柱贯穿天地，蘑菇云遮天蔽日", "warning_note": "E≥1.0e15吨TNT，L5灭绝级，适用于冰彗星地表撞击，可能引发物种大灭绝。"}, {"rule_id": "L5-surface-rock-land-null", "level": "L5", "impact_type": "surface", "material": "rock", "target": "land", "angle_group": null, "e_min": 1000000000000000.0, "e_max": 9e+18, "disaster_title": "灭绝级撞击", "main_text": "一颗直径约{{diameter}}公里的岩石小行星以{{velocity}}公里/秒的速度撞击地球，撞击角约为{{angle}}度。进入大气层后，由于岩石结构相对坚固，它在高度{{breakup_altitude}}公里处才发生部分解体，最终仍有{{remain_mass_ratio}}的质量抵达地面。撞击瞬间释放出相当于{{final_tnt}}亿吨TNT的能量，形成覆盖数百公里的火球与冲击波。", "angle_desc": "本次撞击角度未明确区分，但无论何种角度，其能量都足以引发全球性灾难。", "airburst_only": "", "surface_only": "巨大的天体砸入地面，瞬间凿出一个直径超过{{crater_r}}公里的撞击坑，坑底深达数公里。撞击坑边缘溅射物抛向高空，引发全球性尘埃云，遮天蔽日数月之久。", "land_extra": "撞击点周围数千公里内的建筑、森林和地表岩层被彻底摧毁，冲击波引发强烈地震，震级远超常规地震。撞击产生的碎屑和尘埃平流层扩散，导致全球气温骤降，生态系统崩溃。", "ocean_extra": "", "visual_cue": "遮天蔽日的尘埃云与火柱", "warning_note": "E≥1.0e15吨TNT，L5灭绝级，适用于岩石陨石陆地撞击事件，需考虑全球性影响。"}, {"rule_id": "L5-surface-iron-land-null", "level": "L5", "impact_type": "surface", "material": "iron", "target": "land", "angle_group": null, "e_min": 1000000000000000.0, "e_max": 9e+18, "disaster_title": "灭绝级撞击", "main_text": "一颗直径约{{diameter}}公里的铁质小行星以{{velocity}}公里/秒的速度贯穿大气层，其致密结构几乎未在高层大气中解体，剩余质量比例高达{{remain_mass_ratio}}，解体高度仅为{{breakup_altitude}}公里。它携带着相当于{{final_tnt}}百万吨TNT的恐怖能量，在接近地面的瞬间引发全球性灾难。", "angle_desc": "由于该等级灾难的毁灭性远超角度变量影响，冲击效应呈现全向对称的全球性特征。", "airburst_only": "", "surface_only": "铁陨石以近乎垂直的角度猛烈撞击地面，瞬间凿出一个直径约{{crater_r}}公里的巨大撞击坑，坑体深度达数公里，溅射物抛向平流层。撞击核心区半径{{blast_core_r}}公里内一切物质瞬间气化，冲击波与地震波以超音速横扫全球。", "land_extra": "陆地生态系统全面崩溃：撞击点方圆数百公里内森林被连根拔起并点燃，引发全球性大火；强烈的陆地地震导致大陆板块位移，大规模山体滑坡与断层破裂持续数月；撞击尘埃遮蔽阳光，地球进入长达数年的‘撞击冬季’，光合作用停止，食物链彻底断裂。", "ocean_extra": "", "visual_cue": "天崩地裂，蘑菇云遮蔽苍穹", "warning_note": "适用于铁质小行星以地表撞击形式引发灭绝级事件，E≥1e15吨TNT，全球性灾难，不适用于空爆或海洋撞击。"}];

const LEVEL_BOUNDS = [
  ["L1", 0.0,   1e6],
  ["L2", 1e6,   1e9],
  ["L3", 1e9,   1e12],
  ["L4", 1e12,  1e15],
  ["L5", 1e15,  9e18],
];
const MATERIAL_CN2EN = {"冰彗星":"ice","ice":"ice","岩石陨石":"rock","rock":"rock","铁陨石":"iron","iron":"iron"};
// v3.0：target 固定 land
const TARGET_CN2EN   = {"陆地":"land","land":"land"};

function classify_level(final_tnt_tons) {
  for (let i=0;i<LEVEL_BOUNDS.length;i++) {
    const [lv, lo, hi] = LEVEL_BOUNDS[i];
    if (final_tnt_tons >= lo && final_tnt_tons < hi) return lv;
  }
  return "L5";
}
function classify_impact_type(mode_str) {
  if (mode_str.indexOf("地表撞击") !== -1 || mode_str.indexOf("地撞") !== -1) return "surface";
  return "airburst";
}
function classify_angle_group(angle_deg, level) {
  if (level === "L1" || level === "L5") return null;
  if (angle_deg < 30) return "G1";
  if (angle_deg < 60) return "G2";
  return "G3";
}
function match_template(level, impact_type, material, target, angle_group) {
  for (let i=0;i<IMPACT_TEMPLATES.length;i++) {
    const t = IMPACT_TEMPLATES[i];
    if (t["level"] === level && t["impact_type"] === impact_type && t["material"] === material
        && t["target"] === target && t["angle_group"] === angle_group) return t;
  }
  return null;
}
function lookup_template_by_result(result) {
  const echo = result["input_echo"] || {};
  const mode_info = result["mode"] || {};
  const release = result["release"] || {};
  const material = MATERIAL_CN2EN[echo["material"]] || "rock";
  const target   = "land";  // v3.0 固定
  const angle    = parseFloat(echo["angle_deg"]) || 45;
  const final_tnt = parseFloat(release["tnt_tons"]) || 0;
  const impact_type = classify_impact_type(mode_info["mode"] || "");
  const level = classify_level(final_tnt);
  const ag = classify_angle_group(angle, level);
  return match_template(level, impact_type, material, target, ag);
}
function _fmt_num(val, digits) {
  digits = digits == null ? 2 : digits;
  if (val == null) return "N/A";
  const v = Number(val);
  if (isNaN(v)) return String(val);
  if (v === 0) return "0";
  if (Math.abs(v) >= 1e12) return v.toExponential(2);
  if (Math.abs(v) >= 1e6)  return Math.round(v).toLocaleString("en-US");
  if (Math.abs(v) >= 1)    return v.toFixed(digits).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return v.toFixed(digits+2);
}
function _fmt_tnt(tons) {
  const t = Number(tons) || 0;
  if (t >= 1e9) return (t/1e9).toFixed(2)+" 十亿吨";
  if (t >= 1e6) return (t/1e6).toFixed(2)+" 百万吨";
  if (t >= 1e3) return (t/1e3).toFixed(2)+" 千吨";
  return t.toFixed(2)+" 吨";
}
// v3.0：删除 tsunami_h 插槽
const SLOT_KEYS = ["diameter","velocity","angle","final_tnt","remain_mass_ratio",
                   "breakup_altitude","fireball_r","blast_core_r","blast_outer_r",
                   "burn_r","crater_r"];
function build_slot_values(result) {
  const echo    = result["input_echo"] || {};
  const traj    = result["trajectory"] || {};
  const mode_m  = result["mode"] || {};
  const release = result["release"] || {};
  const thermal = result["thermal"] || {};
  const shock   = result["shockwave"] || {};
  const crater  = result["crater"] || {};

  let breakup_alt = mode_m["breakup_altitude_km"];
  if (breakup_alt == null) {
    const brk = traj["breakup"] || {};
    breakup_alt = brk["altitude_km"] || 0;
  }
  const ablation_ratio = mode_m["ablation_ratio"] != null ? mode_m["ablation_ratio"] : (traj["ablation_ratio"] || 0);
  const remain_ratio = Math.max(1.0 - ablation_ratio, 0.0);
  const crater_d = parseFloat(crater["crater_diameter_km"]) || 0;
  const crater_r = crater_d > 0 ? crater_d / 2.0 : 0.0;

  return {
    "diameter":          _fmt_num(echo["diameter_m"] || 0),
    "velocity":          _fmt_num(echo["velocity_kms"] || 0),
    "angle":             _fmt_num(echo["angle_deg"] || 0, 1),
    "final_tnt":         _fmt_tnt(release["tnt_tons"] || 0),
    "remain_mass_ratio": (remain_ratio*100).toFixed(1)+"%",
    "breakup_altitude":  _fmt_num(breakup_alt, 2),
    "fireball_r":        _fmt_num(thermal["fireball_radius_km"] || 0),
    "blast_core_r":      _fmt_num(shock["core_radius_km"] || 0),
    "blast_outer_r":     _fmt_num(shock["outer_radius_km"] || 0),
    "burn_r":            _fmt_num(thermal["burn_radius_km"] || 0),
    "crater_r":          _fmt_num(crater_r),
  };
}
function fill_template(template, result) {
  const slots = build_slot_values(result);
  const out = {};
  for (const k in template) out[k] = template[k];
  // v3.0：陆地版仅处理陆地相关文本字段
  const textFields = ["main_text","angle_desc","airburst_only","surface_only",
                      "land_extra","visual_cue","warning_note"];
  for (let i=0;i<textFields.length;i++) {
    const f = textFields[i];
    if (typeof out[f] === "string") {
      let s = out[f];
      for (let k in slots) s = s.split("{{"+k+"}}").join(String(slots[k]));
      out[f] = s;
    }
  }
  return out;
}
function _build_energy_comparison(physics_init) {
  const fun = physics_init["fun_references"] || {};
  const tnt = physics_init["tnt_tons"] || 0;
  const parts = ["初始TNT当量约 " + _fmt_tnt(tnt)];
  for (const name in fun) {
    const val = fun[name];
    if (val && val > 0) parts.push("≈ " + _fmt_num(val, 1) + " 颗" + name);
  }
  return parts.join("，");
}
// 对外接口：返回 {content}
function generate_narrative_local(result) {
  const tmpl = lookup_template_by_result(result);
  if (!tmpl) return {content: "模板库中未找到匹配的模板。"};
  const filled = fill_template(tmpl, result);
  const parts = [filled["main_text"]];
  if (filled["airburst_only"]) parts.push(filled["airburst_only"]);
  if (filled["surface_only"])  parts.push(filled["surface_only"]);
  if (filled["land_extra"])    parts.push(filled["land_extra"]);
  const init = result["initial"] || {};
  parts.push("📊 " + _build_energy_comparison(init));
  parts.push("🎬 " + filled["visual_cue"]);
  return {content: parts.join("\n\n")};
}

function hexToRgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}

  canvas.height=H;
  // 重新生成星空，确保铺满整个画布
  initStarfield();
  // 重设地球
  if(typeof LAST_RESULT!=='undefined'&&LAST_RESULT)setupEarth();
  // 触发重绘
  if(typeof draw==='function')draw(performance.now());
}

let CAM={x:0,y:0,zoom:1};
function resetCamera(){CAM.x=0;CAM.y=0;CAM.zoom=1;}
let _camDrag=false,_camLX=0,_camLY=0;
canvas.addEventListener('mousedown',e=>{_camDrag=true;_camLX=e.clientX;_camLY=e.clientY;canvas.style.cursor='grabbing';e.preventDefault();});
window.addEventListener('mousemove',e=>{
  if(!_camDrag)return;
  CAM.x+=e.clientX-_camLX;CAM.y+=e.clientY-_camLY;
  _camLX=e.clientX;_camLY=e.clientY;
  if(!ANIM.playing)draw(performance.now());
});

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const factor=e.deltaY<0?1.12:0.89;
  const nz=clamp(CAM.zoom*factor,0.08,3.0);
  const sc=nz/CAM.zoom;
  // 缩放中心为鼠标位置
  CAM.x=mx-(mx-CAM.x)*sc;
  CAM.y=my-(my-CAM.y)*sc;
  CAM.zoom=nz;
  if(!ANIM.playing)draw(performance.now());
},{passive:false});

// ============== 星空 ==============
let stars={far:[],mid:[],near:[]};
function initStarfield(){
  stars.far=[];stars.mid=[];stars.near=[];
  // 远层星星：布满整个背景
  for(let i=0;i<500;i++)stars.far.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*0.8+0.3,p:Math.random()*6.28,s:0.3+Math.random()*0.5});
  // 中层星星：更亮
  for(let i=0;i<200;i++)stars.mid.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+0.6,p:Math.random()*6.28,s:0.6+Math.random()*0.8});
  // 近层星星：大而亮
  for(let i=0;i<50;i++)stars.near.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+1.2,p:Math.random()*6.28,s:0.8+Math.random()*1.2});
}
function drawStarfield(t){
  // 计算世界坐标系中的可见区域
  const visX=(-CAM.x)/CAM.zoom,visY=(-CAM.y)/CAM.zoom;
  const visW=W/CAM.zoom,visH=H/CAM.zoom;
  // 用固定的W/H取模（星点生成范围），确保任何缩放/平移下都铺满
  function wrap(px,py){
    return{x:((px-visX)%W+W)%W+visX,y:((py-visY)%H+H)%H+visY};
  }
  for(const s of stars.far){const p=wrap(s.x,s.y);const tw=0.4+0.4*Math.sin(t*0.001*s.p+s.p);ctx.fillStyle=`rgba(255,255,255,${tw.toFixed(3)})`;ctx.beginPath();ctx.arc(p.x,p.y,s.r,0,6.28);ctx.fill();}
  for(const s of stars.mid){const p=wrap(s.x,s.y);const tw=0.5+0.45*Math.sin(t*0.0015*s.p+s.p);ctx.fillStyle=`rgba(230,240,255,${tw.toFixed(3)})`;ctx.beginPath();ctx.arc(p.x,p.y,s.r,0,6.28);ctx.fill();}
  for(const s of stars.near){const p=wrap(s.x,s.y);const tw=0.65+0.5*Math.sin(t*0.002*s.p+s.p);
    // 大星星带光晕
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,s.r*3);
    g.addColorStop(0,`rgba(255,250,230,${tw.toFixed(3)})`);
    g.addColorStop(0.4,`rgba(255,240,200,${(tw*0.3).toFixed(3)})`);
    g.addColorStop(1,'rgba(255,230,180,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,s.r*3,0,6.28);ctx.fill();
    ctx.fillStyle=`rgba(255,250,230,${tw.toFixed(3)})`;
    ctx.beginPath();ctx.arc(p.x,p.y,s.r,0,6.28);ctx.fill();}
}

// ============== 地球（地平线下整块地面）==============
let EARTH=null;
function setupEarth(){
  const gy=H*0.5;
  EARTH={gy,features:[],citySkyline:[]};
  for(let i=0;i<15;i++)EARTH.features.push({x:Math.random()*W,y:gy+10+Math.random()*(H-gy)*0.8,s:15+Math.random()*35,a:0.3+Math.random()*0.4});
  const baseH=18, count=28;
  let cx=0;
  for(let i=0;i<count;i++){
    const w=20+Math.random()*50;
    const h=baseH+Math.random()*55;
    const type=Math.random();
    let shape='rect';
    if(type>0.85)shape='tower';
    else if(type>0.65)shape='spire';
    const cols=Math.max(1,Math.floor(w/8));
    const rows=Math.max(1,Math.floor(h/10));
    const wins=[];
    for(let r=1;r<rows;r++){
      for(let c=0;c<cols;c++){
        if(Math.random()<0.55){
          wins.push({x:2+c*(w-4)/cols,y:3+r*(h-6)/rows});
        }
      }
    }
    EARTH.citySkyline.push({x:cx,w,h,shape,windows:wins});
    cx+=w+3+Math.random()*8;
  }
  const totalW=cx;
  EARTH.cityOffset=(W-totalW)/2;
}
function drawEarth(t){
  if(!EARTH)return;const{gy}=EARTH;
  // 可见世界坐标范围（考虑相机变换），地面延伸到所有可见区域
  const visX=(-CAM.x)/CAM.zoom,visY=(-CAM.y)/CAM.zoom;
  const visW=W/CAM.zoom,visH=H/CAM.zoom;
  const farL=visX-visW,farR=visX+visW*2,farB=visY+visH*2;
  const groundTop=gy;
  // 大气辉光（地平线上方渐变带）
  const gl=ctx.createLinearGradient(0,groundTop-60,0,groundTop+10);
  gl.addColorStop(0,'rgba(30,60,100,0)');gl.addColorStop(0.6,'rgba(50,100,160,0.1)');gl.addColorStop(1,'rgba(80,140,200,0.3)');
  ctx.fillStyle=gl;ctx.fillRect(farL,groundTop-60,farR-farL,70);
  // 地平线下整块地面（矩形）- 强制陆地
  const g=ctx.createLinearGradient(0,groundTop,0,farB);
  g.addColorStop(0,'#2d4a2a');g.addColorStop(0.4,'#1a3018');g.addColorStop(1,'#080f08');
  ctx.fillStyle=g;ctx.fillRect(farL,groundTop,farR-farL,farB-groundTop);
  // 地平线细边
  ctx.strokeStyle='rgba(90,140,90,0.4)';
  ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(farL,groundTop);ctx.lineTo(farR,groundTop);ctx.stroke();
  // 陆地纹理（限制在地面区域）
  if(EARTH.features){
    ctx.save();ctx.beginPath();ctx.rect(farL,groundTop,farR-farL,farB-groundTop);ctx.clip();
    for(const f of EARTH.features){ctx.globalAlpha=f.a;ctx.fillStyle='rgba(20,50,25,1)';
      ctx.beginPath();ctx.ellipse(f.x,f.y,f.s,f.s*0.35,0,0,6.28);ctx.fill();}
    ctx.restore();
  }
  if(EARTH.citySkyline&&EARTH.citySkyline.length>0){
    ctx.save();
    const baseX=EARTH.cityOffset||0;
    // 城市主轮廓
    ctx.fillStyle='rgba(10,15,20,0.85)';
    for(const b of EARTH.citySkyline){
      const bx=baseX+b.x, by=groundTop-b.h;
      if(bx+b.w<farL||bx>farR)continue;
      if(b.shape==='rect'){
        ctx.fillRect(bx,by,b.w,b.h);
      }else if(b.shape==='tower'){
        ctx.fillRect(bx+b.w*0.25,by+b.h*0.15,b.w*0.5,b.h*0.85);
        ctx.fillRect(bx,by+b.h*0.35,b.w,b.h*0.65);
        // 塔顶天线
        ctx.fillRect(bx+b.w*0.45,by-6,b.w*0.1,6+b.h*0.15);
      }else if(b.shape==='spire'){
        ctx.fillRect(bx,by+b.h*0.4,b.w,b.h*0.6);
        ctx.beginPath();
        ctx.moveTo(bx,by+b.h*0.4);
        ctx.lineTo(bx+b.w*0.5,by);
        ctx.lineTo(bx+b.w,by+b.h*0.4);
        ctx.closePath();ctx.fill();
      }
    }
    // 窗户灯光
    ctx.fillStyle='rgba(255,200,100,0.35)';
    for(const b of EARTH.citySkyline){
      const bx=baseX+b.x, by=groundTop-b.h;
      if(bx+b.w<farL||bx>farR)continue;
      for(const w of b.windows){
        ctx.fillRect(bx+w.x, by+w.y, 2.5, 3);
      }
    }
    ctx.restore();
  }
}

// 上海为原点(0km)，西向城市在左侧(-)，东向城市在右侧(+)
// 比例尺：1 km = 0.15 px（世界坐标），可配合滚轮缩放查看远近城市
const CITY_SCALE = 0.15; // px per km（0.15 = 1px ≈ 6.7km）
const DAMAGE_VIS = 1.0;   // 灾害圈与城市标记共用同一地理比例尺

function drawCityMarkers(){
  if(!EARTH) return;
  const gy = EARTH.gy;
  const cx = W / 2; // 上海位于屏幕中心

  // 可见范围（世界坐标，含边距）
  const visL = (-CAM.x) / CAM.zoom - 100;
  const visR = (-CAM.x + W) / CAM.zoom + 100;

  for(let i = 0; i < SHANGHAI_CITIES.length; i++){
    const city = SHANGHAI_CITIES[i];
    const px = cx + city.dist * city.side * CITY_SCALE;
    if(px < visL || px > visR) continue; // 视口剔除

    const isOrigin = city.name === '上海';
    const color = isOrigin ? '#ffd700' : 'rgba(120,180,255,0.7)';
    const dotColor = isOrigin ? '#ffd700' : 'rgba(100,170,255,0.9)';

    // 竖线标记（上海实线，其他虚线）
    ctx.strokeStyle = color;
    ctx.lineWidth = isOrigin ? 2 : 1;
    ctx.setLineDash(isOrigin ? [] : [3, 3]);
    ctx.beginPath();
    ctx.moveTo(px, gy - 10);
    ctx.lineTo(px, gy + 10);
    ctx.stroke();
    ctx.setLineDash([]);

    // 圆点
    ctx.fillStyle = dotColor;
    ctx.beginPath();
    ctx.arc(px, gy, isOrigin ? 4 : 2.5, 0, 6.28);
    ctx.fill();

    // 标签上下交替：上海固定上方，其他按索引奇偶交替
    // 左侧城市偶数(0,2,4...)在上方，奇数(1,3,5...)在下方
    // 右侧城市同理，避免相邻城市标签重叠
    var labelUp;
    if(isOrigin){
      labelUp = true;
    } else {
      // 按同侧城市计数交替
      var sameSideIdx = 0;
      for(var j = 0; j < i; j++){
        if(SHANGHAI_CITIES[j].side === city.side) sameSideIdx++;
      }
      labelUp = (sameSideIdx % 2 === 0);
    }

    // 连接线：从圆点到标签
    var lineEnd = labelUp ? gy - 18 : gy + 18;
    ctx.strokeStyle = 'rgba(100,170,255,0.35)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(px, gy);
    ctx.lineTo(px, lineEnd);
    ctx.stroke();

    // 标签文字：城市名 + 距离分两行
    ctx.font = isOrigin ? 'bold 11px "Microsoft YaHei"' : '10px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    var nameText = isOrigin ? '★ 上海' : city.name;
    var distText = city.dist > 0 ? city.dist.toLocaleString() + ' 千米' : '';
    var nameW = ctx.measureText(nameText).width;
    var distW = distText ? ctx.measureText(distText).width : 0;
    var maxW = Math.max(nameW, distW);

    // 标签背景圆角矩形
    var bgH = distText ? 28 : 15;
    var bgY = labelUp ? (gy - 18 - bgH) : (gy + 18);
    var bgX = px - maxW/2 - 5;
    ctx.fillStyle = isOrigin ? 'rgba(40,30,5,0.85)' : 'rgba(10,20,35,0.8)';
    roundRect(ctx, bgX, bgY, maxW + 10, bgH, 4);
    ctx.fill();
    ctx.strokeStyle = isOrigin ? 'rgba(255,215,0,0.4)' : 'rgba(100,170,255,0.25)';
    ctx.lineWidth = 0.8;
    ctx.stroke();

    // 城市名
    var textY = labelUp ? (bgY + 12) : (bgY + 12);
    ctx.fillStyle = isOrigin ? '#ffd700' : 'rgba(180,220,255,0.95)';
    ctx.fillText(nameText, px, textY);

    // 距离（第二行）
    if(distText){
      ctx.font = '9px Consolas';
      ctx.fillStyle = isOrigin ? 'rgba(255,215,0,0.7)' : 'rgba(120,170,220,0.7)';
      ctx.fillText(distText, px, textY + 12);
    }
  }

  // 比例尺（右下角地面区域）
  const scaleKm = 1000; // 1000 千米 刻度
  const scalePx = scaleKm * CITY_SCALE;
  const sbx = cx + W * 0.3;
  const sby = gy + 35;
  if(sbx + scalePx < visR){
    ctx.strokeStyle = 'rgba(150,200,255,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(sbx, sby);
    ctx.lineTo(sbx + scalePx, sby);
    ctx.moveTo(sbx, sby - 4);
    ctx.lineTo(sbx, sby + 4);
    ctx.moveTo(sbx + scalePx, sby - 4);
    ctx.lineTo(sbx + scalePx, sby + 4);
    ctx.stroke();
    ctx.font = '10px Consolas';
    ctx.fillStyle = 'rgba(150,200,255,0.6)';
    ctx.textAlign = 'center';
    ctx.fillText(`${scaleKm} 千米`, sbx + scalePx/2, sby + 14);
  }
}
// 大气分层（国际气象组织标准），单位 km。MAX_ALT=200 时热层截断到200km
const ATMOSPHERE_LAYERS=[
  {name:'对流层', bot:0,  top:12,  fill:'rgba(80,150,210,0.18)',  edge:'rgba(120,180,220,0.70)', label:'rgba(150,200,230,0.98)', desc:'天气现象'},
  {name:'平流层', bot:12, top:50,  fill:'rgba(160,120,200,0.14)', edge:'rgba(180,140,220,0.60)', label:'rgba(200,160,230,0.98)', desc:'臭氧层'},
  {name:'中间层', bot:50, top:85,  fill:'rgba(60,100,180,0.12)',  edge:'rgba(90,130,200,0.55)',  label:'rgba(140,170,220,0.98)', desc:'流星烧蚀'},
  {name:'热层',   bot:85, top:600, fill:'rgba(180,80,120,0.14)',  edge:'rgba(200,100,140,0.50)', label:'rgba(220,130,170,0.98)', desc:'极光层'},
];
const ALT_CONTOUR_STEP=20; // km，等海拔线步长（MAX_ALT=200 时每条间距合适）

function drawAtmosphereLayers(time){
  if(!EARTH)return;
  // 世界坐标系可见区域
  const visX=(-CAM.x)/CAM.zoom, visW=W/CAM.zoom;
  const farL=visX-visW, farR=visX+visW*2;
  // 自下而上绘制各层（地面到高空）
  for(const L of ATMOSPHERE_LAYERS){
    const topH=Math.min(L.top, MAX_ALT);
    if(topH<=L.bot) continue;
    const yTop=altToY(topH);
    const yBot=altToY(L.bot);
    const yMid=(yTop+yBot)/2;  // 标签放在层中央，避免窄层标签溢出
    // 填充色块
    ctx.fillStyle=L.fill;
    ctx.fillRect(farL, yTop, farR-farL, yBot-yTop);
    // 顶部分界线（虚线）
    ctx.save();
    ctx.strokeStyle=L.edge; ctx.lineWidth=1; ctx.setLineDash([6,8]);
    ctx.beginPath(); ctx.moveTo(farL, yTop); ctx.lineTo(farR, yTop); ctx.stroke();
    ctx.restore();
    // 右侧层名标签（层中央，带描述）
    const labelX=farR-12;
    const topStr=L.top>=600?Math.min(L.top,MAX_ALT)+'+':L.top;
    const txt=L.name+'  '+L.bot+'~'+topStr+' 千米';
    ctx.save();
    ctx.font='11px "Microsoft YaHei"'; ctx.textBaseline='middle'; ctx.textAlign='right';
    const tw=ctx.measureText(txt).width;
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillRect(labelX-tw-8, yMid-18, tw+12, 18);
    ctx.fillStyle=L.label;
    ctx.fillText(txt, labelX, yMid-9);
    // 第二行：描述
    const txt2=L.desc;
    const tw2=ctx.measureText(txt2).width;
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(labelX-tw2-8, yMid+1, tw2+12, 14);
    ctx.fillStyle='rgba(180,200,220,0.75)';
    ctx.font='10px "Microsoft YaHei"';
    ctx.fillText(txt2, labelX, yMid+8);
    ctx.restore();
  }
}

function drawAltitudeContours(time){
  if(!EARTH)return;
  const visX=(-CAM.x)/CAM.zoom, visW=W/CAM.zoom;
  const farL=visX-visW, farR=visX+visW*2;
  // 每 10km 一条等海拔线
  for(let h=ALT_CONTOUR_STEP; h<MAX_ALT; h+=ALT_CONTOUR_STEP){
    const y=altToY(h);
    // 虚线
    ctx.save();
    ctx.strokeStyle='rgba(120,160,200,0.38)'; ctx.lineWidth=0.9; ctx.setLineDash([3,6]);
    ctx.beginPath(); ctx.moveTo(farL, y); ctx.lineTo(farR, y); ctx.stroke();
    ctx.restore();
    // 左侧高度标签
    ctx.save();
    ctx.font='10px Consolas,monospace'; ctx.textBaseline='middle'; ctx.textAlign='left';
    const txt=h+' 千米';
    const tw=ctx.measureText(txt).width;
    ctx.fillStyle='rgba(0,0,0,0.55)';
    ctx.fillRect(farL+4, y-7, tw+8, 14);
    ctx.fillStyle='rgba(180,210,240,0.85)';
    ctx.fillText(txt, farL+8, y);
    ctx.restore();
  }
}
