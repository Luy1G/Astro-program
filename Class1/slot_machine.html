<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 豪华老虎机 - 澳门赌场风格</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Playfair+Display:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #1a0f00 0%, #3d2b1f 50%, #1a0f00 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffd700;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.1) 0%, rgba(0, 0, 0, 0.8) 100%);
            z-index: -1;
        }
        
        .container {
            background: linear-gradient(135deg, #2d1e12 0%, #1a1008 50%, #2d1e12 100%);
            border: 3px solid #ffd700;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.5), inset 0 0 30px rgba(255, 215, 0, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            background: linear-gradient(45deg, #ffd700, #ffed4e, #ffd700);
            border-radius: 35px;
            z-index: -1;
            animation: borderGlow 3s ease-in-out infinite;
        }
        
        @keyframes borderGlow {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            color: #ffd700;
            margin-bottom: 30px;
            font-size: 36px;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            letter-spacing: 3px;
        }
        
        .balance-section {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1) 0%, rgba(255, 215, 0, 0.05) 100%);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
        }
        
        .balance-item {
            font-size: 22px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .balance-item span {
            color: #ffed4e;
            font-size: 24px;
            font-weight: 900;
        }
        
        .reels-container {
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 50%, #1a1a1a 100%);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
            margin: 30px 0;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 215, 0, 0.1);
        }
        
        .reels {
            display: flex;
            justify-content: space-around;
            height: 150px;
        }
        
        .reel {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #4a3728 0%, #3d2b1f 50%, #4a3728 100%);
            border: 2px solid #ffd700;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 215, 0, 0.3);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .reel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            animation: shine 2s linear infinite;
        }
        
        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .reel.spinning {
            animation: spin 0.3s linear infinite;
            background: linear-gradient(135deg, #3a2a1e 0%, #2d1e12 50%, #3a2a1e 100%);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 215, 0, 0.6);
        }
        
        @keyframes spin {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(360deg); }
        }
        
        .controls {
            margin: 30px 0;
        }
        
        .bet-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }
        
        .bet-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);
            color: #1a1008;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }
        
        .bet-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
        }
        
        .bet-value {
            font-size: 24px;
            font-weight: 900;
            min-width: 100px;
            color: #ffed4e;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }
        
        .spin-btn {
            width: 250px;
            height: 70px;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 50%, #ff6b35 100%);
            color: white;
            border: 3px solid #ffd700;
            border-radius: 40px;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.6), 0 0 30px rgba(255, 215, 0, 0.3);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .spin-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.8), 0 0 40px rgba(255, 215, 0, 0.5);
        }
        
        .spin-btn:disabled {
            background: #666;
            border-color: #999;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        
        .message {
            margin: 30px 0;
            padding: 20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1) 0%, rgba(255, 215, 0, 0.05) 100%);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .message.win {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.2) 0%, rgba(76, 175, 80, 0.1) 100%);
            color: #4CAF50;
            border-color: #4CAF50;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.8);
        }
        
        .message.lose {
            background: linear-gradient(135deg, rgba(244, 67, 54, 0.2) 0%, rgba(244, 67, 54, 0.1) 100%);
            color: #F44336;
            border-color: #F44336;
            text-shadow: 0 0 10px rgba(244, 67, 54, 0.8);
        }
        
        .paytable {
            margin-top: 30px;
            border-top: 2px solid rgba(255, 215, 0, 0.3);
            padding-top: 20px;
        }
        
        .paytable h3 {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 20px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .paytable-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .paytable-item {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1) 0%, rgba(255, 215, 0, 0.05) 100%);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .paytable-item:hover {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15) 0%, rgba(255, 215, 0, 0.1) 100%);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
        
        .paytable-item .symbol {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .paytable-item .payout {
            font-weight: 900;
            color: #ffed4e;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }
        
        .instruction {
            margin-top: 20px;
            font-size: 14px;
            color: rgba(255, 215, 0, 0.7);
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
        }
        
        @media (max-width: 480px) {
            .container {
                margin: 20px;
                padding: 25px;
            }
            
            h1 {
                font-size: 28px;
            }
            
            .reel {
                width: 80px;
                height: 80px;
                font-size: 32px;
            }
            
            .spin-btn {
                width: 200px;
                height: 60px;
                font-size: 20px;
            }
        }
        
        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            background: #f00;
            border-radius: 50%;
            z-index: 1000;
        }
        
        .glow-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 豪华老虎机</h1>
        
        <div class="balance-section">
            <div class="balance-item">
                💰 余额: <span id="balance">1000</span> ¥
            </div>
            <div class="balance-item">
                🎯 下注: <span id="bet">10</span> ¥
            </div>
        </div>
        
        <div class="reels-container">
            <div class="glow-effect"></div>
            <div class="reels">
                <div class="reel" id="reel1">?</div>
                <div class="reel" id="reel2">?</div>
                <div class="reel" id="reel3">?</div>
            </div>
        </div>
        
        <div class="controls">
            <div class="bet-controls">
                <button class="bet-btn" id="decreaseBet">-</button>
                <div class="bet-value" id="betValue">10</div>
                <button class="bet-btn" id="increaseBet">+</button>
            </div>
            
            <button class="spin-btn" id="spinBtn">🔄 开始旋转</button>
        </div>
        
        <div class="message" id="message">按空格键开始游戏，再次按空格键停止滚轮！</div>
        
        <div class="instruction">
            🎮 操作说明：空格键 - 开始/停止滚轮 | ↑↓ 方向键 - 调整下注
        </div>
        
        <div class="paytable">
            <h3>🎁 赔率表</h3>
            <div class="paytable-grid" id="paytable"></div>
        </div>
    </div>
    
    <script>
        const SYMBOLS = ["🍒", "🍋", "🍊", "🍇", "🔔", "💎", "7️⃣ ", "⭐"];
        const SYMBOL_NAMES = ["樱桃", "柠檬", "橙子", "葡萄", "铃铛", "钻石", "七", "星星"];
        
        const PAYOUTS = {
            "🍒": 2,
            "🍋": 3,
            "🍊": 4,
            "🍇": 5,
            "🔔": 8,
            "💎": 15,
            "7️⃣ ": 25,
            "⭐": 50
        };
        
        const WEIGHTS = [25, 20, 18, 15, 10, 7, 3, 2];
        const BET_OPTIONS = [10, 25, 50, 100, 200, 500];
        
        let balance = 1000;
        let betIndex = 0;
        let isSpinning = false;
        let spinningReels = [];
        let stoppedReels = [];
        let reelIntervals = [];
        let reelSymbols = [];
        
        const balanceElement = document.getElementById('balance');
        const betElement = document.getElementById('bet');
        const betValueElement = document.getElementById('betValue');
        const reel1 = document.getElementById('reel1');
        const reel2 = document.getElementById('reel2');
        const reel3 = document.getElementById('reel3');
        const spinBtn = document.getElementById('spinBtn');
        const messageElement = document.getElementById('message');
        const paytableElement = document.getElementById('paytable');
        const decreaseBetBtn = document.getElementById('decreaseBet');
        const increaseBetBtn = document.getElementById('increaseBet');
        
        function updateDisplay() {
            balanceElement.textContent = balance;
            const bet = BET_OPTIONS[betIndex];
            betElement.textContent = bet;
            betValueElement.textContent = bet;
            
            const currentBet = BET_OPTIONS[betIndex];
            spinBtn.disabled = currentBet > balance || isSpinning;
        }
        
        function weightedChoice() {
            const total = WEIGHTS.reduce((sum, w) => sum + w, 0);
            let r = Math.floor(Math.random() * total) + 1;
            let cumulative = 0;
            for (let i = 0; i < WEIGHTS.length; i++) {
                cumulative += WEIGHTS[i];
                if (r <= cumulative) {
                    return SYMBOLS[i];
                }
            }
            return SYMBOLS[0];
        }
        
        function calculateWinnings(reel1, reel2, reel3, bet) {
            if (reel1 === reel2 && reel2 === reel3) {
                const multiplier = PAYOUTS[reel1] || 2;
                return [bet * multiplier, "三连！"];
            } else if (reel1 === reel2 || reel2 === reel3 || reel1 === reel3) {
                const matching = reel1 === reel2 || reel1 === reel3 ? reel1 : reel2;
                const multiplier = Math.max(Math.floor((PAYOUTS[matching] || 2) / 3), 1);
                return [bet * multiplier, "两连！"];
            } else {
                return [0, ""];
            }
        }
        
        function startReelSpin(reelElement) {
            reelElement.classList.add('spinning');
            
            const interval = setInterval(() => {
                reelElement.textContent = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
            }, 50);
            
            return interval;
        }
        

        
        function startSpin() {
            if (isSpinning) return;
            
            const bet = BET_OPTIONS[betIndex];
            if (bet > balance) {
                showMessage("余额不足！请减少下注金额", "lose");
                return;
            }
            
            isSpinning = true;
            balance -= bet;
            updateDisplay();
            showMessage("旋转中... 按空格键停止滚轮！", "");
            
            spinBtn.disabled = true;
            
            spinningReels = [reel1, reel2, reel3];
            stoppedReels = [];
            reelIntervals = [];
            reelSymbols = [];
            
            spinningReels.forEach(reel => {
                const interval = startReelSpin(reel);
                reelIntervals.push(interval);
            });
        }
        
        function stopNextReel() {
            if (!isSpinning || spinningReels.length === 0) return;
            
            const nextReel = spinningReels.shift();
            const intervalIndex = reelIntervals.shift();
            
            clearInterval(intervalIndex);
            nextReel.classList.remove('spinning');
            
            let speed = 50;
            let slowDownCount = 0;
            const maxSlowDown = 12;
            
            function slowDown() {
                speed += 25;
                slowDownCount++;
                
                if (slowDownCount >= maxSlowDown) {
                    const finalSymbol = weightedChoice();
                    nextReel.textContent = finalSymbol;
                    reelSymbols.push(finalSymbol);
                    stoppedReels.push(nextReel);
                    
                    if (spinningReels.length === 0) {
                        setTimeout(() => {
                            const bet = BET_OPTIONS[betIndex];
                            const [winnings, resultType] = calculateWinnings(reelSymbols[0], reelSymbols[1], reelSymbols[2], bet);
                            
                            if (winnings > 0) {
                                balance += winnings;
                                showMessage(`${resultType} 恭喜！赢得 ¥${winnings}！`, "win");
                                createConfetti();
                            } else {
                                showMessage("没有中奖，再试试！", "lose");
                            }
                            
                            isSpinning = false;
                            
                            if (balance < BET_OPTIONS[betIndex]) {
                                for (let i = 0; i < BET_OPTIONS.length; i++) {
                                    if (BET_OPTIONS[i] <= balance) {
                                        betIndex = i;
                                    }
                                }
                                if (BET_OPTIONS[betIndex] > balance) {
                                    betIndex = 0;
                                }
                            }
                            
                            updateDisplay();
                        }, 500);
                    } else {
                        showMessage(`已停止 ${3 - spinningReels.length} 个滚轮，继续按空格键停止下一个！`, "");
                    }
                } else {
                    nextReel.textContent = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
                    setTimeout(slowDown, speed);
                }
            }
            
            slowDown();
        }
        
        function showMessage(text, type) {
            messageElement.textContent = text;
            messageElement.className = 'message';
            if (type) {
                messageElement.classList.add(type);
            }
        }
        
        function createConfetti() {
            for (let i = 0; i < 150; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                
                const colors = ['#ffd700', '#ffed4e', '#ff6b35', '#f7931e', '#4CAF50', '#2196F3'];
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                confetti.style.left = `${Math.random() * 100}vw`;
                confetti.style.top = '-10px';
                confetti.style.width = `${Math.random() * 12 + 8}px`;
                confetti.style.height = `${Math.random() * 12 + 8}px`;
                confetti.style.opacity = '0.8';
                confetti.style.animation = `fall ${Math.random() * 4 + 3}s linear forwards`;
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                document.body.appendChild(confetti);
                
                setTimeout(() => {
                    confetti.remove();
                }, 7000);
            }
        }
        
        function populatePaytable() {
            paytableElement.innerHTML = '';
            
            SYMBOLS.forEach((symbol, index) => {
                const item = document.createElement('div');
                item.className = 'paytable-item';
                
                const symbolElement = document.createElement('div');
                symbolElement.className = 'symbol';
                symbolElement.textContent = symbol;
                
                const nameElement = document.createElement('div');
                nameElement.textContent = SYMBOL_NAMES[index];
                
                const payoutElement = document.createElement('div');
                payoutElement.className = 'payout';
                payoutElement.textContent = `x${PAYOUTS[symbol]}`;
                
                item.appendChild(symbolElement);
                item.appendChild(nameElement);
                item.appendChild(payoutElement);
                
                paytableElement.appendChild(item);
            });
        }
        
        spinBtn.addEventListener('click', startSpin);
        
        decreaseBetBtn.addEventListener('click', () => {
            if (betIndex > 0) {
                betIndex--;
                updateDisplay();
            }
        });
        
        increaseBetBtn.addEventListener('click', () => {
            if (betIndex < BET_OPTIONS.length - 1) {
                betIndex++;
                updateDisplay();
            }
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!isSpinning) {
                    startSpin();
                } else {
                    stopNextReel();
                }
            } else if (e.code === 'ArrowUp' && !isSpinning) {
                if (betIndex < BET_OPTIONS.length - 1) {
                    betIndex++;
                    updateDisplay();
                }
            } else if (e.code === 'ArrowDown' && !isSpinning) {
                if (betIndex > 0) {
                    betIndex--;
                    updateDisplay();
                }
            }
        });
        
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fall {
                to {
                    transform: translateY(100vh) rotate(720deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
        
        populatePaytable();
        updateDisplay();
    </script>
</body>
</html>
