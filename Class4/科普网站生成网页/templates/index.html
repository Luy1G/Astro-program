<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科普文章自动生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        .main-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .form-section {
            padding: 40px;
            border-bottom: 1px solid #eee;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 1.1em;
        }
        input[type="text"], select {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.1em;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-generate {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .preview-section {
            padding: 40px;
            background: #fafafa;
        }
        .preview-section h2 {
            color: #333;
            margin-bottom: 20px;
        }
        #article-preview {
            background: white;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            min-height: 300px;
            font-size: 1em;
            line-height: 1.8;
        }
        .placeholder {
            color: #999;
            text-align: center;
            padding: 100px 0;
        }
        .status {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .saved-path {
            margin-top: 15px;
            padding: 10px 15px;
            background: #e7f3ff;
            border-radius: 8px;
            color: #0066cc;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 科普文章自动生成器</h1>
            <p>基于 arXiv 论文和 DeepSeek AI 的智能科普文章生成工具</p>
        </header>

        <div class="main-card">
            <form class="form-section" method="post" action="/">
                {% if error %}
                <div class="status error">
                    ⚠️ {{ error }}
                </div>
                {% endif %}

                <div class="form-group">
                    <label for="keyword">🔍 研究主题</label>
                    <input type="text" id="keyword" name="keyword" placeholder="输入关键词，如：黑洞、人工智能、量子计算" required value="{{ request.form.keyword or '' }}">
                </div>

                <div class="form-group">
                    <label for="version">📝 文章版本</label>
                    <select id="version" name="version">
                        <option value="public" {% if request.form.version == 'public' %}selected{% endif %}>📖 大众版（通俗易懂，适合普通读者）</option>
                        <option value="scholar" {% if request.form.version == 'scholar' %}selected{% endif %}>📚 学者版（严谨专业，适合研究人员）</option>
                    </select>
                </div>

                <button type="submit" class="btn-generate">
                    🚀 生成文章
                </button>
            </form>

            <div class="preview-section">
                <h2>📄 文章预览</h2>
                <div id="article-preview">
                    {% if article %}
                        {{ article | safe }}
                        <div class="saved-path">💾 已保存到：{{ saved_path }}</div>
                    {% else %}
                        <div class="placeholder">
                            👆 请输入关键词并点击「生成文章」
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
